<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Kami Mini-Ada</title>
<style>
  @font-face { font-family: "Chakra Petch"; src: url("fonts/ChakraPetch-Medium.ttf"); font-weight: 500; }
  @font-face { font-family: "Chakra Petch"; src: url("fonts/ChakraPetch-Bold.ttf"); font-weight: 700; }
  :root {
    --cov: #A855F7;
    --cov2: #2EE6A6;
  }
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: #09070E; color: #EDE9F6;
    font: 600 12px "Chakra Petch", system-ui, sans-serif;
  }
  .pill {
    position: relative; width: 100%; height: 100%;
    padding: 0 11px;
    background: #09070E;
    border: 1px solid rgba(157,107,255,0.28);
    display: flex; flex-direction: column; justify-content: center; gap: 3px;
    transition: border-color .18s ease;
    overflow: hidden;
  }
  .pill.music-mode {
    border-color: color-mix(in srgb, var(--cov) 45%, rgba(255,255,255,0.12));
  }
  .pill::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(circle at 18% 50%, color-mix(in srgb, var(--cov) 32%, transparent), transparent 68%),
                radial-gradient(circle at 88% 50%, color-mix(in srgb, var(--cov2) 18%, transparent), transparent 60%);
    transition: opacity .22s ease;
  }
  .pill.music-mode.expanded::before { opacity: 1; }
  .row {
    position: relative; z-index: 1;
    display: flex; align-items: center; gap: 8px; min-width: 0; height: 34px;
  }
  .subrow {
    position: relative; z-index: 1;
    display: none; align-items: center; gap: 8px; height: 22px; padding-left: 36px;
  }
  .pill.music-mode.expanded .subrow { display: flex; }
  .dot {
    width: 14px; height: 14px; border-radius: 50%; flex: none;
    background: #0B0912; border: 1.5px solid #2EE6A6;
    box-shadow: 0 0 8px rgba(46,230,166,0.45);
    -webkit-app-region: drag;
  }
  .dot.talk { border-color: #34D399; box-shadow: 0 0 12px #34D399; }
  .drag-handle {
    cursor: grab; -webkit-app-region: drag;
    display: inline-flex; align-items: center; gap: 6px; min-width: 0;
  }
  .cover {
    width: 28px; height: 28px; border-radius: 6px; flex: none; object-fit: cover;
    border: 1px solid rgba(255,255,255,0.12); background: #140F20;
  }
  .cover-fb {
    width: 28px; height: 28px; border-radius: 6px; flex: none;
    display: grid; place-items: center;
    background: linear-gradient(135deg, #271645, #12101B);
    border: 1px solid rgba(168,85,247,0.35); color: #C4B5FD;
  }
  .meta {
    flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.15;
    cursor: grab; -webkit-app-region: drag;
  }
  .title { font-size: 12px; color: #F5F3FF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .artist { font-size: 10.5px; color: #9F96B8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .spd { color: #2EE6A6; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .vram {
    font-size: 10.5px; color: #B4FFD8; background: rgba(46,230,166,0.12);
    border: 1px solid rgba(46,230,166,0.22); padding: 2px 7px; border-radius: 999px; white-space: nowrap;
  }
  .prof {
    font-size: 10.5px; color: #D8B4FE; background: rgba(168,85,247,0.14);
    border: 1px solid rgba(168,85,247,0.24); padding: 2px 7px; border-radius: 999px; white-space: nowrap;
    max-width: 96px; overflow: hidden; text-overflow: ellipsis;
  }
  .sep { width: 1px; height: 15px; background: rgba(255,255,255,0.10); flex: none; }
  .ctrls { display: inline-flex; align-items: center; gap: 3px; flex: none; }
  .ib {
    width: 24px; height: 24px; border-radius: 6px; border: 1px solid transparent;
    background: transparent; color: #D6CFE8; display: grid; place-items: center;
    cursor: pointer; padding: 0; flex: none; transition: background .12s, color .12s, border-color .12s;
  }
  .ib:hover { background: rgba(168,85,247,0.22); color: #fff; border-color: rgba(168,85,247,0.35); }
  .ib.pri { background: rgba(255,255,255,0.08); color: #fff; }
  .ib.pri:hover { background: var(--cov); color: #09070E; }
  .ib.bad { background: rgba(244,63,94,0.18); color: #FDA4AF; }
  .ib svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ib svg.fill { fill: currentColor; stroke: none; }
  .btn {
    background: #1B1329; color: #EDE9F6; border: 1px solid rgba(157,107,255,0.32);
    border-radius: 7px; height: 24px; padding: 0 9px; cursor: pointer;
    font: inherit; font-size: 11px; white-space: nowrap; flex: none;
  }
  .btn:hover { background: #332154; border-color: rgba(196,181,253,0.55); }
  .x {
    background: none; border: 0; color: #8A81A3; cursor: pointer; font-size: 13px;
    width: 22px; height: 22px; display: grid; place-items: center; border-radius: 6px; flex: none;
  }
  .x:hover { color: #fff; background: rgba(255,255,255,0.08); }
  .seekbar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
    background: rgba(255,255,255,0.08); cursor: pointer; z-index: 3;
  }
  .pill.music-mode.expanded .seekbar { height: 4px; }
  .seekfill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--cov), var(--cov2));
    transition: width .3s linear;
  }
  .tm { font-size: 10.5px; color: #A69EC0; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .lyric {
    flex: 1; min-width: 0; font-size: 11px; color: #E9D5FF;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .drop-bar {
    position: relative; z-index: 2;
    display: flex; align-items: center; justify-content: space-between; gap: 6px; width: 100%;
  }
  .drop-lbl { font-size: 11.5px; color: #C4B5FD; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .drop-acts { display: flex; gap: 5px; flex: none; }
</style>
</head>
<body>
<div class="pill" id="pill">
  <div class="row" id="mainRow">
    <div class="drag-handle" id="idleGrip"><div class="dot" id="dot"></div><span class="spd" id="spd">0 MB/s</span></div>
    <span class="vram" id="vram">VRAM —</span>
    <span class="prof" id="prof">Kişisel</span>
    <div style="flex:1"></div>
    <button class="btn" id="openMain">Aç</button>
    <button class="x" id="closeBtn" title="Mini-Ada'yı Gizle">✕</button>
  </div>
  <div class="subrow" id="subRow">
    <span class="tm" id="tmLbl">0:00 / 0:00</span>
    <span class="lyric" id="lyricLbl"></span>
  </div>
  <div class="seekbar" id="seekBar" hidden><div class="seekfill" id="seekFill"></div></div>
</div>
<script>
const api = () => window.pywebview?.api;
const pill = document.getElementById("pill");
const mainRow = document.getElementById("mainRow");
const subRow = document.getElementById("subRow");
const seekBar = document.getElementById("seekBar");
const seekFill = document.getElementById("seekFill");
const tmLbl = document.getElementById("tmLbl");
const lyricLbl = document.getElementById("lyricLbl");

let curMode = "idle";
let curSize = "460x48";
let hovered = false;
let collapseTimer = 0;
let lastState = null;
let dropFiles = null;
let dropTimer = 0;
const coverColors = new Map();

const SVG = {
  prev: '<svg viewBox="0 0 24 24"><path class="fill" d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>',
  play: '<svg viewBox="0 0 24 24"><path class="fill" d="M7 5v14l11-7z"/></svg>',
  pause: '<svg viewBox="0 0 24 24"><path class="fill" d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg>',
  next: '<svg viewBox="0 0 24 24"><path class="fill" d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>',
  note: '<svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>',
  mic: '<svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M19 11a7 7 0 0 1-14 0"/></svg>',
  micoff: '<svg viewBox="0 0 24 24"><path d="M9 9v3a3 3 0 0 0 5.1 2.1M15 9.3V6a3 3 0 0 0-5.9-.7M17 14a7 7 0 0 1-10.7 1.3M3 3l18 18"/></svg>',
  ear: '<svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 16 0"/><rect x="3" y="13" width="4" height="7" rx="2"/><rect x="17" y="13" width="4" height="7" rx="2"/></svg>',
  earoff: '<svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 13.7-5.6M3 3l18 18"/><rect x="3" y="13" width="4" height="7" rx="2"/><rect x="17" y="15" width="4" height="5" rx="2"/></svg>',
  app: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M9 15V9l7 3-7 3z" class="fill"/></svg>',
};

function fmtMs(ms) {
  const s = Math.max(0, Math.floor((ms || 0) / 1000));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function esc(t) {
  return String(t || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function resizeWin(w, h) {
  const key = w + "x" + h;
  if (curSize === key) return;
  curSize = key;
  api()?.mini_island_resize?.(w, h);
}
function applyCoverColor(url) {
  if (!url) { pill.style.setProperty("--cov", "#A855F7"); return; }
  if (coverColors.has(url)) { pill.style.setProperty("--cov", coverColors.get(url)); return; }
  // deterministic hue fallback + image sample if CORS allows
  let hash = 0;
  for (let i = 0; i < url.length; i++) hash = (hash * 31 + url.charCodeAt(i)) | 0;
  const fallback = `hsl(${Math.abs(hash) % 360}, 78%, 62%)`;
  coverColors.set(url, fallback);
  pill.style.setProperty("--cov", fallback);
  const img = new Image();
  img.crossOrigin = "anonymous";
  img.onload = () => {
    try {
      const c = document.createElement("canvas");
      c.width = 4; c.height = 4;
      const g = c.getContext("2d");
      g.drawImage(img, 0, 0, 4, 4);
      const d = g.getImageData(0, 0, 4, 4).data;
      let r = 0, gr = 0, b = 0, n = 0;
      for (let i = 0; i < d.length; i += 4) {
        if (d[i] + d[i+1] + d[i+2] > 70) { r += d[i]; gr += d[i+1]; b += d[i+2]; n++; }
      }
      if (n) {
        const col = `rgb(${Math.round(r/n)},${Math.round(gr/n)},${Math.round(b/n)})`;
        coverColors.set(url, col);
        pill.style.setProperty("--cov", col);
      }
    } catch {}
  };
  img.src = url;
}

function renderDrop(files) {
  curMode = "drop";
  pill.className = "pill";
  seekBar.hidden = true;
  resizeWin(520, 74);
  const name = files?.length ? files[0].split(/[\\/]/).pop() : "Dosya";
  mainRow.innerHTML = `<div class="drop-bar">
    <span class="drop-lbl" title="${esc(name)}">⊕ ${esc(name)}${files && files.length > 1 ? ` (+${files.length - 1})` : ""}</span>
    <div class="drop-acts">
      <button class="btn" data-drop="player">Oynat</button>
      <button class="btn" data-drop="studio">Studio</button>
      <button class="btn" data-drop="picture">Picture</button>
      <button class="btn" data-drop="convert">Dönüştür</button>
      <button class="x" id="dropCancel">✕</button>
    </div>
  </div>`;
  mainRow.querySelectorAll("[data-drop]").forEach((b) => {
    b.onclick = async () => {
      await api()?.mini_island_drop_action?.(b.dataset.drop, dropFiles || []);
      dropFiles = null;
      refresh();
    };
  });
  document.getElementById("dropCancel").onclick = () => { dropFiles = null; refresh(); };
}

function renderRoom(st) {
  curMode = "room";
  pill.className = "pill";
  seekBar.hidden = true;
  resizeWin(460, 48);
  const r = st.room;
  const people = r.people || [];
  const talker = people.find((p) => p.talk);
  const names = talker ? talker.name : people.map((p) => p.name).filter(Boolean).slice(0, 3).join(", ");
  mainRow.innerHTML = `
    <div class="drag-handle"><div class="dot${talker ? " talk" : ""}"></div></div>
    <span class="title" style="max-width:190px">${esc(names || "Kami Oda")}</span>
    <span class="prof">${people.length} kişi</span>
    <div style="flex:1"></div>
    <button class="ib${r.muted ? " bad" : ""}" id="rmMic" title="Mikrofon">${r.muted ? SVG.micoff : SVG.mic}</button>
    <button class="ib${r.deaf ? " bad" : ""}" id="rmDeaf" title="Kulaklık">${r.deaf ? SVG.earoff : SVG.ear}</button>
    <button class="btn" id="rmOpen">Oda</button>
    <button class="x" id="closeBtn">✕</button>`;
  document.getElementById("rmMic").onclick = () => api()?.room_island_cmd?.("mic");
  document.getElementById("rmDeaf").onclick = () => api()?.room_island_cmd?.("deaf");
  document.getElementById("rmOpen").onclick = () => api()?.room_open?.();
  document.getElementById("closeBtn").onclick = () => api()?.mini_island_toggle?.(false);
}

let lastMusicId = "";
function renderMusic(st) {
  curMode = "music";
  const m = st.music;
  const allowExpand = st.island_music_expand !== false;
  const exp = allowExpand && hovered;
  pill.className = "pill music-mode" + (exp ? " expanded" : "");
  seekBar.hidden = false;
  if (exp) resizeWin(540, 74);
  else resizeWin(allowExpand ? 390 : 440, 48);

  applyCoverColor(m.cover);
  const pct = m.duration_ms > 0 ? Math.min(100, Math.max(0, (m.progress_ms / m.duration_ms) * 100)) : 0;
  seekFill.style.width = pct.toFixed(1) + "%";
  tmLbl.textContent = `${fmtMs(m.progress_ms)} / ${fmtMs(m.duration_ms)}`;
  lyricLbl.textContent = m.lyric_line || (m.playing ? "Çalıyor" : "Duraklatıldı");

  const sig = `${m.id}|${m.playing ? 1 : 0}|${m.cover}`;
  if (lastMusicId === sig && mainRow.querySelector("#muPlay")) {
    const tEl = mainRow.querySelector("#muTitle");
    const aEl = mainRow.querySelector("#muArtist");
    if (tEl && tEl.textContent !== m.title) tEl.textContent = m.title;
    if (aEl && aEl.textContent !== (m.artist || "")) aEl.textContent = m.artist || "";
    return;
  }
  lastMusicId = sig;
  const covHtml = m.cover
    ? `<img class="cover" src="${esc(m.cover)}" alt="" onerror="this.style.display='none'">`
    : `<div class="cover-fb">${SVG.note}</div>`;
  mainRow.innerHTML = `
    ${covHtml}
    <div class="meta">
      <span class="title" id="muTitle">${esc(m.title)}</span>
      <span class="artist" id="muArtist">${esc(m.artist || "Kamify")}</span>
    </div>
    <div class="ctrls">
      <button class="ib" id="muPrev" title="Önceki">${SVG.prev}</button>
      <button class="ib pri" id="muPlay" title="${m.playing ? "Duraklat" : "Oynat"}">${m.playing ? SVG.pause : SVG.play}</button>
      <button class="ib" id="muNext" title="Sonraki">${SVG.next}</button>
    </div>
    <div class="sep"></div>
    <button class="ib" id="muApp" title="Kamify'ı Aç">${SVG.app}</button>
    <button class="x" id="closeBtn" title="Gizle">✕</button>`;
  document.getElementById("muPrev").onclick = () => api()?.mini_island_music_cmd?.("previous");
  document.getElementById("muPlay").onclick = () => api()?.mini_island_music_cmd?.("toggle");
  document.getElementById("muNext").onclick = () => api()?.mini_island_music_cmd?.("next");
  document.getElementById("muApp").onclick = () => api()?.music_open?.();
  document.getElementById("closeBtn").onclick = () => api()?.mini_island_toggle?.(false);
}

function renderIdle(st) {
  curMode = "idle";
  lastMusicId = "";
  pill.className = "pill";
  seekBar.hidden = true;
  resizeWin(460, 48);
  const spdMb = (st.speed || 0) / (1024 * 1024);
  const vram = st.telemetry?.vram_used_pct != null ? `VRAM ${st.telemetry.vram_used_pct}%` : `RAM ${st.telemetry?.ram_used_pct || 0}%`;
  const profMap = { kisisel: "Kişisel", icerik: "İçerik", magaza: "Mağaza" };
  const pName = profMap[st.profile?.id] || st.profile?.name || "Kişisel";
  const spdTxt = st.active > 0 ? `${spdMb.toFixed(1)} MB/s (${st.active})` : `${spdMb.toFixed(1)} MB/s`;
  mainRow.innerHTML = `
    <div class="drag-handle"><div class="dot"></div><span class="spd">${esc(spdTxt)}</span></div>
    <span class="vram">${esc(vram)}</span>
    <span class="prof">${esc(pName)}</span>
    <div style="flex:1"></div>
    <button class="btn" id="openRoom">Oda</button>
    <button class="btn" id="openMain">Aç</button>
    <button class="x" id="closeBtn" title="Gizle">✕</button>`;
  document.getElementById("openRoom").onclick = () => api()?.room_open?.();
  document.getElementById("openMain").onclick = () => api()?.mini_island_open_main?.();
  document.getElementById("closeBtn").onclick = () => api()?.mini_island_toggle?.(false);
}

seekBar.addEventListener("click", (e) => {
  if (!lastState?.music?.duration_ms) return;
  const r = seekBar.getBoundingClientRect();
  const ratio = Math.max(0, Math.min(1, (e.clientX - r.left) / Math.max(1, r.width)));
  api()?.mini_island_music_cmd?.("seek", Math.round(ratio * lastState.music.duration_ms));
});

pill.addEventListener("mouseenter", () => {
  clearTimeout(collapseTimer);
  hovered = true;
  if (curMode === "music" && lastState) renderMusic(lastState);
});
pill.addEventListener("mouseleave", () => {
  clearTimeout(collapseTimer);
  collapseTimer = setTimeout(() => {
    hovered = false;
    if (curMode === "music" && lastState) renderMusic(lastState);
  }, 180);
});

window.kamiIslandExternalDrop = (files) => {
  dropFiles = files && files.length ? files : [];
  clearTimeout(dropTimer);
  renderDrop(dropFiles);
  dropTimer = setTimeout(() => { dropFiles = null; refresh(); }, 8000);
};
document.addEventListener("dragenter", (e) => { e.preventDefault(); renderDrop([]); });
document.addEventListener("dragover", (e) => { e.preventDefault(); });
document.addEventListener("dragleave", (e) => {
  if (!e.relatedTarget) { clearTimeout(dropTimer); dropTimer = setTimeout(() => { dropFiles = null; refresh(); }, 600); }
});
document.addEventListener("drop", (e) => {
  e.preventDefault();
  const fs = [...(e.dataTransfer?.files || [])].map((f) => f.path || f.name).filter(Boolean);
  if (fs.length) window.kamiIslandExternalDrop(fs);
});

async function refresh() {
  if (dropFiles) return;
  try {
    const st = await api()?.mini_island_state?.();
    if (!st) return;
    lastState = st;
    if (st.room && Array.isArray(st.room.people) && st.room.people.length >= 1) renderRoom(st);
    else if (st.music && st.music.title) renderMusic(st);
    else renderIdle(st);
  } catch {}
}

setInterval(refresh, 1000);
window.addEventListener("pywebviewready", refresh);
</script>
</body>
</html>
