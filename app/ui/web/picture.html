<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Kami Picture</title>
<link rel="stylesheet" href="scroll.css">
<link rel="stylesheet" href="picture.css">
<link rel="stylesheet" href="editor.css">
</head>
<body>
  <div id="pic">
    <header class="pc-top">
      <span class="pc-logo">KAMI <b>Picture</b></span>
      <b id="pcName">—</b><span id="pcInfo"></span><span class="sp"></span>
      <button data-a="grab" title="Ekran Yakala (Lens / Beautify / Sabitle)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 9h6v6H9z"/></svg> <span data-tr="Yakala" data-en="Capture"></span></button>
      <button data-a="edit" class="edit" title="E" data-need-img disabled>✎ <span data-tr="Düzenle" data-en="Edit"></span></button>
      <button data-a="new" title="N">＋ <span data-tr="Yeni" data-en="New"></span></button>
      <button data-a="rot" title="R" data-need-img disabled>⟳ <span data-tr="Döndür" data-en="Rotate"></span></button>
      <button data-a="fit" title="0" data-need-img disabled><span data-tr="Sığdır" data-en="Fit"></span></button>
      <button data-a="nobg" data-need-img disabled><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 3v18M3 9h18" opacity=".5"/></svg> <span data-tr="Arka planı kaldır" data-en="Remove background"></span></button>
      <button data-a="beautify" title="B" data-need-img disabled><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px"><rect x="4" y="4" width="16" height="16" rx="4"/><rect x="8" y="8" width="8" height="8" rx="2"/></svg> <span data-tr="Beautify" data-en="Beautify"></span></button>
      <button data-a="pin" title="P" data-need-img disabled><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px"><path d="M12 17v5M7 4h10l-1.5 6 2 3H6.5l2-3z"/></svg> <span data-tr="Sabitle" data-en="Pin"></span></button>
      <button data-a="conv" data-need-img disabled>⇄ <span data-tr="Dönüştür" data-en="Convert"></span></button>
      <button data-a="mockup" data-need-img disabled title="Perspektif Mockup"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px"><path d="M3 8l9-4 9 4v8l-9 4-9-4z"/><path d="M3 8l9 4 9-4M12 12v8"/></svg> <span data-tr="Mockup" data-en="Mockup"></span></button>
      <button data-a="folder" data-need-img disabled><span data-tr="Klasör" data-en="Folder"></span></button>
      <button data-a="lens" class="lens" data-need-img disabled>◎ Kami Lens</button>
      <button data-a="bridge" title="AI Köprü Durumu"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px"><circle cx="12" cy="5" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="19" r="2"/><path d="M12 7v4M7 17l3-6M17 17l-3-6"/></svg> <span data-tr="AI Köprü" data-en="AI Bridge"></span></button>
    </header>
    <main class="pc-main">
      <section class="pc-stage" id="pcStage">
        <img id="pcImg" alt="">
        <p class="pc-empty" id="pcEmpty"><span data-tr="Bir görseli buraya bırak ya da Kami'de aç" data-en="Drop an image here or open one in Kami"></span></p>
        <button class="pc-nav l" data-a="prev" hidden>‹</button><button class="pc-nav r" data-a="next" hidden>›</button>
      </section>
      <aside class="pc-lens" id="pcLens" hidden></aside>
      <aside class="pc-beautify" id="pcBeautify" hidden></aside>
    </main>
  </div>
  <script src="kami-embed.js"></script>
  <script src="kami-guard.js"></script>
  <script src="palette.js"></script>
  <script src="kask.js"></script>
<script src="picture.js"></script>
  <script src="picture-lens.js"></script>
  <script src="editor-fx.js"></script>
  <script src="editor.js"></script>
  <script src="editor-ai.js"></script>
  <script src="editor-pro.js"></script>
  <script src="editor-photopea.js"></script>
  <script src="picture-v138.js"></script>
</body>
</html>
