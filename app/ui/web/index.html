<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kami</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="sunak.css">
</head>
<body>
  <header class="topbar">
    <div class="brand" aria-label="Kami">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M6 5h14l6 6v16H6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        <path d="M20 5v6h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        <path d="M16 13v9m-4-4 4 4 4-4" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand-name">Kami</span>
    </div>
    <form class="add" id="addForm" autocomplete="off">
      <input id="addInput" type="text" spellcheck="false" data-i18n-placeholder="add_placeholder">
      <button type="button" class="btn" id="pasteBtn" data-i18n-title="paste_clip">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6v3H9zM7 5.5H5.5v15h13v-15H17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span data-i18n="paste_short"></span>
      </button>
      <button type="button" class="btn" id="torrentPick" data-i18n-title="tor_pick">.torrent</button>
      <button type="submit" class="btn primary" data-i18n="add_button"></button>
    </form>
    <button class="icon-btn" id="settingsBtn" data-i18n-title="settings" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7.4 7.4 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 11a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.4 7.4 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7.4 7.4 0 0 0 1.7-1l2.4 1 2-3.4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </button>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Filtreler">
      <div class="nav-group" data-i18n-aria="group_status">
        <button class="nav-item active" data-filter="all"><span data-i18n="filter_all"></span><b data-count="all"></b></button>
        <button class="nav-item" data-filter="active"><span data-i18n="filter_active"></span><b data-count="active"></b></button>
        <button class="nav-item" data-filter="paused"><span data-i18n="filter_paused"></span><b data-count="paused"></b></button>
        <button class="nav-item" data-filter="complete"><span data-i18n="filter_complete"></span><b data-count="complete"></b></button>
        <button class="nav-item" data-filter="error"><span data-i18n="filter_error"></span><b data-count="error"></b></button>
      </div>
      <div class="nav-sep"></div>
      <div class="nav-group" data-i18n-aria="group_type">
        <button class="nav-item" data-filter="cat:video"><i class="dot c-video"></i><span data-i18n="cat_video"></span><b data-count="cat:video"></b></button>
        <button class="nav-item" data-filter="cat:music"><i class="dot c-music"></i><span data-i18n="cat_music"></span><b data-count="cat:music"></b></button>
        <button class="nav-item" data-filter="cat:archive"><i class="dot c-archive"></i><span data-i18n="cat_archive"></span><b data-count="cat:archive"></b></button>
        <button class="nav-item" data-filter="cat:program"><i class="dot c-program"></i><span data-i18n="cat_program"></span><b data-count="cat:program"></b></button>
        <button class="nav-item" data-filter="cat:document"><i class="dot c-document"></i><span data-i18n="cat_document"></span><b data-count="cat:document"></b></button>
        <button class="nav-item" data-filter="cat:other"><i class="dot c-other"></i><span data-i18n="cat_other"></span><b data-count="cat:other"></b></button>
      </div>
      <div class="nav-sep"></div>
      <div class="nav-group">
        <button class="nav-item" data-view="rd"><i class="dot c-torrent"></i><span>Real-Debrid</span></button>
        <button class="nav-item" data-view="follow"><i class="dot c-video"></i><span data-i18n="v_follow"></span><b id="followCount"></b></button>
        <button class="nav-item" data-view="history"><i class="dot c-other"></i><span data-i18n="v_history"></span></button>
        <button class="nav-item" data-view="batch"><i class="dot c-archive"></i><span data-i18n="v_batch"></span></button>
        <button class="nav-item" data-view="convert"><i class="dot c-document"></i><span class="cv-navlbl">Dönüştürücü</span></button>
      </div>
      <div class="sidebar-foot">
        <button class="link-btn" id="openDownloads" data-i18n="open_downloads"></button>
      </div>
    </nav>

    <main class="main">
      <section class="speed" aria-live="off">
        <canvas id="speedCanvas" aria-hidden="true"></canvas>
        <div class="speed-readout">
          <div class="speed-value"><span id="speedNum">0</span><small id="speedUnit">KB/s</small></div>
          <div class="speed-sub" id="activeCount"></div>
        </div>
      </section>

      <div class="toolbar">
        <button class="btn ghost" id="pauseAll" data-i18n="pause_all"></button>
        <button class="btn ghost" id="resumeAll" data-i18n="resume_all"></button>
        <span class="spacer"></span>
        <button class="btn ghost" id="speedToggle" data-i18n-title="speed_toggle_t"></button>
        <label class="tb-conc"><span data-i18n="tb_concurrent"></span>
          <select id="concSel"></select></label>
        <button class="btn ghost" id="shutdownToggle" data-i18n-title="sd_title"></button>
        <button class="btn ghost" id="clearFinished" data-i18n="clear_finished"></button>
      </div>

      <ul class="live" id="liveList" role="list" hidden></ul>
      <ul class="list" id="list" role="list"></ul>
      <div class="empty" id="empty" hidden>
        <h2 data-i18n="empty_title"></h2>
        <p id="emptyBody" data-i18n="empty_body"></p>
      </div>

      <section class="xview" id="followView" data-i18n-aria="v_follow">
        <div class="rd-head"><h2 data-i18n="v_follow"></h2><span class="hint" data-i18n="fw_hint"></span><span class="spacer"></span>
          <button type="button" class="btn ghost" id="followCheckAll" data-i18n="fw_check_all"></button></div>
        <form class="fw-add" id="followForm" autocomplete="off">
          <input id="followUrl" type="text" spellcheck="false" data-i18n-placeholder="fw_ph">
          <select id="followFmt"><option value="mp4">MP4</option><option value="mp3">MP3</option></select>
          <label class="tb-conc"><span data-i18n="fw_backfill"></span><input id="followBack" type="number" min="0" max="30" value="0"></label>
          <button type="submit" class="btn primary" data-i18n="fw_add"></button>
        </form>
        <ul class="rd-list" id="followList"></ul>
        <p class="hint" id="followEmpty" data-i18n="fw_empty" hidden></p>
      </section>

      <section class="xview" id="historyView" data-i18n-aria="v_history">
        <div class="rd-head"><h2 data-i18n="v_history"></h2><span class="spacer"></span>
          <button type="button" class="btn ghost danger" id="historyClear" data-i18n="hs_clear"></button></div>
        <div class="fw-add"><input id="historyQ" type="text" spellcheck="false" data-i18n-placeholder="hs_ph"></div>
        <ul class="rd-list" id="historyList"></ul>
        <p class="hint" id="historyEmpty" data-i18n="hs_empty" hidden></p>
      </section>

      <section class="xview" id="convertView" aria-label="Dönüştürücü"></section>

      <section class="xview" id="batchView" data-i18n-aria="v_batch">
        <div class="rd-head"><h2 data-i18n="v_batch"></h2><span class="hint" data-i18n="bt_hint"></span></div>
        <textarea id="batchText" rows="5" spellcheck="false" data-i18n-placeholder="bt_ph"></textarea>
        <div class="fw-add">
          <input id="batchPage" type="text" spellcheck="false" data-i18n-placeholder="bt_page_ph">
          <button type="button" class="btn ghost" id="batchFetch" data-i18n="bt_fetch"></button>
          <button type="button" class="btn ghost" id="batchParse" data-i18n="bt_parse"></button>
        </div>
        <div class="fw-add">
          <span class="chips" id="batchChips">
            <button type="button" class="chip on" data-k="all" data-i18n="bt_k_all"></button>
            <button type="button" class="chip" data-k="video" data-i18n="bt_k_video"></button>
            <button type="button" class="chip" data-k="music" data-i18n="bt_k_music"></button>
            <button type="button" class="chip" data-k="archive" data-i18n="bt_k_archive"></button>
            <button type="button" class="chip" data-k="doc" data-i18n="bt_k_doc"></button>
            <button type="button" class="chip" data-k="image" data-i18n="bt_k_image"></button>
          </span>
          <input id="batchFilter" type="text" spellcheck="false" data-i18n-placeholder="bt_filter_ph">
          <span class="hint" id="batchCount"></span>
          <button type="button" class="btn ghost" id="batchAll" data-i18n="bt_all"></button>
          <button type="button" class="btn ghost" id="batchNone" data-i18n="bt_none"></button>
          <button type="button" class="btn primary" id="batchAdd" data-i18n="bt_add"></button>
        </div>
        <p class="hint" id="batchInfo"></p>
        <ul class="batch-list" id="batchList"></ul>
      </section>

      <section class="rd-view" id="rdView" aria-label="Real-Debrid">
        <div class="rd-head">
          <h2>Real-Debrid</h2><span class="hint" id="rdUser"></span><span class="spacer"></span>
          <button type="button" class="btn ghost" id="rdRefresh" data-i18n="rd_refresh"></button>
        </div>
        <div class="rd-notoken" id="rdNoToken" hidden>
          <p data-i18n="rd_notoken"></p>
          <button type="button" class="btn primary" id="rdOpenSettings" data-i18n="rd_set_token"></button>
        </div>
        <div id="rdBody" hidden>
          <form class="rd-add" id="rdForm" autocomplete="off">
            <textarea id="rdInput" rows="3" spellcheck="false" data-i18n-placeholder="rd_placeholder"></textarea>
            <div class="rd-add-actions">
              <button type="button" class="btn ghost" id="rdPick" data-i18n="rd_pick"></button>
              <button type="submit" class="btn primary" id="rdSend" data-i18n="rd_send"></button>
            </div>
          </form>
          <h3 data-i18n="rd_torrents"></h3>
          <ul class="rd-list" id="rdTorrents"></ul>
          <h3 data-i18n="rd_downloads"></h3>
          <ul class="rd-list" id="rdDownloads"></ul>
        </div>
      </section>
    </main>
  </div>

  <footer class="statusbar">
    <span id="engineStatus"></span>
    <span id="bridgeStatus"></span>
    <button type="button" class="link-btn update-link" id="updateLink" hidden></button>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <div class="clip-offer" id="clipOffer" role="alertdialog" hidden>
    <span data-i18n="clip_ask"></span> <b id="clipUrl"></b>
    <button type="button" class="btn primary" id="clipYes" data-i18n="clip_yes"></button>
    <button type="button" class="btn" id="clipNo" data-i18n="clip_no"></button>
  </div>
  <div class="ctx-menu" id="ctxMenu" role="menu" hidden>
    <button type="button" role="menuitem" data-cmd="cut" data-i18n="ctx_cut"></button>
    <button type="button" role="menuitem" data-cmd="copy" data-i18n="ctx_copy"></button>
    <button type="button" role="menuitem" data-cmd="paste" data-i18n="ctx_paste"></button>
    <button type="button" role="menuitem" data-cmd="selectAll" data-i18n="ctx_select_all"></button>
  </div>

  <dialog id="settings" aria-labelledby="settingsTitle">
    <form method="dialog" class="settings-form" id="settingsForm">
      <header class="dialog-head">
        <h2 id="settingsTitle" data-i18n="settings"></h2>
        <button class="icon-btn" value="close" data-i18n-title="close" aria-label="close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </header>

      <fieldset>
        <legend data-i18n="s_general"></legend>
        <label class="row"><span data-i18n="s_language"></span>
          <select name="language"><option value="tr">Türkçe</option><option value="en">English</option></select>
        </label>
        <label class="row"><span data-i18n="s_theme"></span>
          <select name="theme"><option value="dark" data-i18n="theme_dark"></option><option value="light" data-i18n="theme_light"></option></select>
        </label>
      </fieldset>

      <fieldset>
        <legend data-i18n="s_downloads"></legend>
        <div class="row dir-row">
          <span data-i18n="s_dir"></span>
          <div class="dir-ctl">
            <code id="dirPath"></code>
            <button type="button" class="btn ghost" id="dirChange" data-i18n="s_dir_change"></button>
            <button type="button" class="btn ghost" id="dirReset" data-i18n="s_dir_reset"></button>
          </div>
        </div>
        <label class="check"><input type="checkbox" name="use_category_folders"><span data-i18n="s_catfolders"></span></label>
        <label class="check"><input type="checkbox" name="smart_series_folders"><span data-i18n="s_seriesfolders"></span></label>
        <label class="row"><span data-i18n="s_connections"></span><input type="number" name="connections" min="1" max="16"></label>
        <label class="row"><span data-i18n="s_concurrent"></span><input type="number" name="max_concurrent" min="1" max="20"></label>
        <label class="row"><span data-i18n="s_speedlimit"></span><input type="number" name="speed_limit_kib" min="0" step="256"></label>
        <label class="row"><span data-i18n="s_tries"></span><input type="number" name="max_tries" min="0" max="50"></label>
      </fieldset>

      <fieldset>
        <legend data-i18n="s_browser"></legend>
        <label class="check"><input type="checkbox" name="capture_enabled"><span data-i18n="s_capture"></span></label>
        <label class="check"><input type="checkbox" name="clipboard_watch"><span data-i18n="s_clipwatch"></span></label>
        <label class="row"><span data-i18n="s_minsize"></span><input type="number" name="capture_min_size_kib" min="0" step="64"></label>
        <label class="row stack"><span data-i18n="s_exclude"></span><input type="text" name="capture_exclude_hosts" spellcheck="false"></label>
        <label class="row stack"><span data-i18n="s_confirmext"></span><input type="text" name="confirm_extensions" spellcheck="false"></label>
        <p class="hint" data-i18n="s_capture_hint"></p>
      </fieldset>

      <fieldset>
        <legend>Real-Debrid</legend>
        <div class="row dir-row">
          <span data-i18n="s_rd_token"></span>
          <div class="dir-ctl">
            <input type="password" id="rdToken" autocomplete="off" spellcheck="false" data-i18n-placeholder="s_rd_token_ph">
            <button type="button" class="btn ghost" id="rdTokenSave" data-i18n="s_rd_save"></button>
            <button type="button" class="btn ghost" id="rdTokenClear" data-i18n="s_rd_clear" hidden></button>
          </div>
        </div>
        <p class="hint" id="rdTokenState"></p>
        <label class="row"><span data-i18n="s_rd_mode"></span>
          <select name="rd_mode">
            <option value="ask" data-i18n="rd_mode_ask"></option>
            <option value="auto" data-i18n="rd_mode_auto"></option>
            <option value="off" data-i18n="rd_mode_off"></option>
          </select>
        </label>
        <p class="hint" data-i18n="s_rd_hint"></p>
      </fieldset>

      <fieldset>
        <legend data-i18n="s_torrent"></legend>
        <label class="check"><input type="checkbox" name="torrent_stop_seeding"><span data-i18n="s_tor_stopseed"></span></label>
        <label class="row"><span data-i18n="s_tor_uplimit"></span><input type="number" name="torrent_upload_limit_kib" min="0" step="64"></label>
        <label class="row"><span data-i18n="s_tor_port"></span><input type="number" name="torrent_port" min="0" max="65535"></label>
        <label class="check"><input type="checkbox" name="torrent_tracker_update"><span data-i18n="s_tor_trackers"></span></label>
        <label class="check"><input type="checkbox" name="aria2_ipv6"><span data-i18n="s_ipv6"></span></label>
        <div class="row"><span data-i18n="s_tor_fw"></span><span><span class="hint" id="fwState"></span>
          <button type="button" class="btn ghost" id="fwAllow" data-i18n="s_tor_fw_add"></button></span></div>
        <p class="hint" data-i18n="s_tor_hint"></p>
      </fieldset>

      <fieldset>
        <legend data-i18n="s_app"></legend>
        <label class="check"><input type="checkbox" name="tray_enabled"><span data-i18n="s_tray"></span></label>
        <label class="check"><input type="checkbox" name="close_to_tray"><span data-i18n="s_close_tray"></span></label>
        <label class="check"><input type="checkbox" name="autostart"><span data-i18n="s_autostart"></span></label>
        <label class="check"><input type="checkbox" name="notify_on_complete"><span data-i18n="s_notify_done"></span></label>
        <label class="check"><input type="checkbox" name="notify_on_error"><span data-i18n="s_notify_err"></span></label>
        <label class="check"><input type="checkbox" name="hotkey_enabled"><span data-i18n="s_hotkey_on"></span></label>
        <label class="row"><span data-i18n="s_hotkey"></span><input type="text" name="hotkey" spellcheck="false" style="width:140px"></label>
        <label class="check"><input type="checkbox" name="song_hotkey_enabled"><span data-i18n="s_song_on"></span></label>
        <label class="row"><span data-i18n="s_song_key"></span><input type="text" name="song_hotkey" spellcheck="false" style="width:140px"></label>
        <label class="check"><input type="checkbox" name="mini_card"><span data-i18n="s_mini_card"></span></label>
        <label class="check"><input type="checkbox" name="auto_mirror"><span data-i18n="s_auto_mirror"></span></label>
        <p class="hint" id="hotkeyState" hidden></p>
        <label class="row"><span data-i18n="s_speed_preset"></span><input type="number" name="speed_limit_preset_kib" min="64" step="256"></label>
      </fieldset>

      <fieldset>
        <legend data-i18n="s_schedule"></legend>
        <label class="check"><input type="checkbox" name="schedule_enabled"><span data-i18n="s_schedule_on"></span></label>
        <label class="row"><span data-i18n="s_schedule_start"></span><input type="time" name="schedule_start"></label>
        <label class="row"><span data-i18n="s_schedule_stop"></span><input type="time" name="schedule_stop"></label>
        <p class="hint" data-i18n="s_schedule_hint"></p>
      </fieldset>

      <fieldset>
        <legend data-i18n="s_mx"></legend>
        <label class="check"><input type="checkbox" name="lyrics_auto"><span data-i18n="s_lyrics_auto"></span></label>
        <label class="check"><input type="checkbox" name="lyrics_embed"><span data-i18n="s_lyrics_embed"></span></label>
        <div class="row"><span data-i18n="s_genius"></span><span><span class="hint" id="geniusState"></span>
          <input type="password" id="geniusToken" spellcheck="false" autocomplete="off" data-i18n-placeholder="s_genius_ph">
          <button type="button" class="btn ghost" id="geniusSave" data-i18n="save"></button>
          <button type="button" class="btn ghost" id="geniusClear" data-i18n="s_genius_clear" hidden></button></span></div>
        <details class="howto"><summary data-i18n="s_genius_how"></summary><div class="hint" data-i18n="s_genius_how_body"></div></details>
        <label class="check"><input type="checkbox" name="lyrics_ai"><span data-i18n="s_lyrics_ai"></span></label>
        <label class="check"><input type="checkbox" name="music_archive"><span data-i18n="s_archive"></span></label>
        <div class="row"><span data-i18n="s_acoustid"></span><input type="text" name="acoustid_key" spellcheck="false" autocomplete="off" data-i18n-placeholder="s_acoustid_ph"></div>
        <details class="howto"><summary data-i18n="s_acoustid_how"></summary><div class="hint" data-i18n="s_acoustid_how_body"></div></details>
        <div class="row"><span data-i18n="s_music_dir"></span><span><span class="hint" id="musicDir"></span>
          <button type="button" class="btn ghost" id="musicDirChange" data-i18n="change_dir"></button>
          <button type="button" class="btn ghost" id="musicDirReset" data-i18n="reset_dir"></button></span></div>
        <label class="check"><input type="checkbox" name="whisper_auto"><span data-i18n="s_whisper_auto"></span></label>
        <label class="row"><span data-i18n="s_whisper_lang"></span>
          <select name="whisper_lang"><option value="auto" data-i18n="lang_auto"></option><option value="tr">Türkçe</option><option value="en">English</option></select></label>
        <label class="row"><span data-i18n="s_whisper_model"></span><select name="whisper_model" id="whisperModelSel"></select></label>
        <label class="check"><input type="checkbox" name="whisper_embed"><span data-i18n="s_whisper_embed"></span></label>
        <label class="check"><input type="checkbox" name="uvr_auto"><span data-i18n="s_uvr_auto"></span></label>
        <label class="row"><span data-i18n="s_uvr_model"></span><select name="uvr_model" id="uvrModelSel"></select></label>
        <label class="row"><span data-i18n="s_uvr_format"></span>
          <select name="uvr_format"><option value="mp3">MP3</option><option value="flac">FLAC</option><option value="wav">WAV</option></select></label>
        <label class="row"><span data-i18n="s_uvr_quality"></span>
          <select name="uvr_quality"><option value="fast" data-i18n="s_uvrq_fast"></option><option value="balanced" data-i18n="s_uvrq_bal"></option><option value="best" data-i18n="s_uvrq_best"></option></select></label>
        <p class="hint" id="aiState"></p>
        <label class="check"><input type="checkbox" name="social_cookies"><span data-i18n="s_social"></span></label>
        <label class="check"><input type="checkbox" name="follow_enabled"><span data-i18n="s_follow"></span></label>
        <label class="row"><span data-i18n="s_follow_int"></span><input type="number" name="follow_interval_min" min="10" max="1440" step="10"></label>
      </fieldset>

      <fieldset>
        <legend data-i18n="s_use"></legend>
        <label class="check"><input type="checkbox" name="rules_enabled"><span data-i18n="s_rules"></span></label>
        <div id="rulesBox" class="rules"></div>
        <div class="row"><span class="hint" data-i18n="s_rules_hint"></span><button type="button" class="btn ghost" id="ruleAdd" data-i18n="s_rule_add"></button></div>
        <label class="check"><input type="checkbox" name="auto_extract"><span data-i18n="s_extract"></span></label>
        <label class="check"><input type="checkbox" name="auto_extract_delete"><span data-i18n="s_extract_del"></span></label>
        <label class="check"><input type="checkbox" name="music_move"><span data-i18n="s_music_move"></span></label>
        <label class="check"><input type="checkbox" name="disk_warn"><span data-i18n="s_disk_warn"></span></label>
        <label class="check"><input type="checkbox" name="link_refresh"><span data-i18n="s_link_refresh"></span></label>
        <label class="check"><input type="checkbox" name="history_enabled"><span data-i18n="s_history"></span></label>
        <label class="check"><input type="checkbox" name="history_warn"><span data-i18n="s_history_warn"></span></label>
        <label class="row"><span data-i18n="s_watch_mb"></span><input type="number" name="watch_min_mb" min="2" max="500"></label>
        <label class="row"><span data-i18n="s_watch_player"></span>
          <select name="watch_player"><option value="kami">Kami Player</option><option value="screenbox">Screenbox</option><option value="default" data-i18n="s_player_default"></option></select></label>
      </fieldset>

      <fieldset>
        <legend data-i18n="s_phone"></legend>
        <label class="check"><input type="checkbox" name="phone_enabled"><span data-i18n="s_phone_on"></span></label>
        <label class="row"><span data-i18n="s_phone_port"></span><input type="number" name="phone_port" min="1024" max="65535"></label>
        <div class="phone-box" id="phoneBox"></div>
        <div class="row"><span class="hint" data-i18n="s_phone_hint"></span><button type="button" class="btn ghost" id="phoneNewKey" data-i18n="s_phone_newkey"></button></div>
        <label class="check"><input type="checkbox" name="ntfy_enabled"><span data-i18n="s_ntfy"></span></label>
        <label class="row"><span data-i18n="s_ntfy_server"></span><input type="text" name="ntfy_server" spellcheck="false"></label>
        <div class="row"><span data-i18n="s_ntfy_topic"></span><span><span class="hint" id="ntfyState"></span>
          <input type="password" id="ntfyTopic" spellcheck="false" autocomplete="off" data-i18n-placeholder="s_ntfy_ph">
          <button type="button" class="btn ghost" id="ntfySave" data-i18n="save"></button>
          <button type="button" class="btn ghost" id="ntfyTest" data-i18n="s_ntfy_test"></button></span></div>
        <label class="check"><input type="checkbox" name="ntfy_each"><span data-i18n="s_ntfy_each"></span></label>
        <label class="check"><input type="checkbox" name="ntfy_queue"><span data-i18n="s_ntfy_queue"></span></label>
        <label class="check"><input type="checkbox" name="ntfy_errors"><span data-i18n="s_ntfy_errors"></span></label>
      </fieldset>

      <fieldset>
        <legend data-i18n="s_security"></legend>
        <label class="row"><span data-i18n="s_defender"></span>
          <select name="defender_mode">
            <option value="exec_archive" data-i18n="def_exec"></option>
            <option value="all" data-i18n="def_all"></option>
            <option value="off" data-i18n="def_off"></option>
          </select>
        </label>
        <p class="hint" id="defenderState" hidden data-i18n="def_missing"></p>
        <label class="check"><input type="checkbox" name="checksum_verify"><span data-i18n="s_checksum"></span></label>
      </fieldset>

      <fieldset>
        <legend data-i18n="s_plugins"></legend>
        <p class="hint" data-i18n="pl_hint"></p>
        <div id="pluginList"></div>
      </fieldset>

      <fieldset>
        <legend data-i18n="s_about"></legend>
        <label class="check"><input type="checkbox" name="update_check"><span data-i18n="s_update_check"></span></label>
        <div class="row"><span><span data-i18n="s_version"></span> <b id="appVersion"></b> <span class="hint" id="updateState"></span></span>
          <button type="button" class="btn ghost" id="updateNow" data-i18n="s_update_now"></button></div>
        <div class="row"><span class="hint" data-i18n="s_report_hint"></span>
          <button type="button" class="btn ghost" id="reportBtn" data-i18n="s_report"></button></div>
      </fieldset>
    </form>
  </dialog>

  <dialog id="hashDlg" aria-labelledby="hashTitle">
    <form method="dialog" class="settings-form" id="hashForm">
      <header class="dialog-head">
        <h2 id="hashTitle">SHA256</h2>
        <button class="icon-btn" value="close" data-i18n-title="close" aria-label="close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </header>
      <p class="hint" id="hashName"></p>
      <code id="hashValue" class="hash-value"></code>
      <label class="row stack"><span data-i18n="hash_expected"></span>
        <input type="text" id="hashExpected" spellcheck="false" data-i18n-placeholder="hash_ph"></label>
      <p id="hashResult" class="hint"></p>
      <div class="rd-add-actions"><button type="button" class="btn ghost" id="hashCopy" data-i18n="hash_copy"></button>
        <button type="button" class="btn primary" id="hashCheck" data-i18n="hash_check"></button></div>
    </form>
  </dialog>

  <dialog id="mtools" aria-labelledby="mtTitle">
    <form method="dialog" class="settings-form">
      <header class="dialog-head">
        <h2 id="mtTitle" data-i18n="mt_title"></h2>
        <button class="icon-btn" value="close" data-i18n-title="close" aria-label="close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </header>
      <p class="hint" id="mtName"></p>
      <div class="mt-row" id="mtLyricsRow"><div><b data-i18n="mt_lyrics"></b><div class="hint" id="mtLyrics"></div><div class="mt-links" id="mtLinks"></div></div>
        <span><button type="button" class="btn ghost" id="mtLyricsBtn" data-i18n="mt_lyrics_find"></button>
        <button type="button" class="btn ghost" id="mtLyricsAiBtn" data-i18n="mt_lyrics_ai"></button></span></div>
      <div class="mt-paste" id="mtPasteRow"><div class="hint" data-i18n="mt_paste_hint"></div>
        <textarea id="mtPaste" rows="5" spellcheck="false" data-i18n-placeholder="mt_paste_ph"></textarea>
        <button type="button" class="btn ghost" id="mtPasteBtn" data-i18n="mt_paste_btn"></button></div>
      <div class="mt-row" id="mtArchiveRow"><div><b data-i18n="mt_archive"></b><div class="hint" id="mtArchive"></div></div>
        <button type="button" class="btn ghost" id="mtArchiveBtn" data-i18n="mt_archive_btn"></button></div>
      <div class="mt-row" id="mtWhisperRow"><div><b data-i18n="mt_whisper"></b><div class="hint" id="mtWhisper"></div></div>
        <span><select id="mtWhisperLang"><option value="auto" data-i18n="lang_auto"></option><option value="tr">TR</option><option value="en">EN</option></select>
        <button type="button" class="btn ghost" id="mtWhisperBtn" data-i18n="mt_run"></button></span></div>
      <div class="mt-row" id="mtUvrRow"><div><b data-i18n="mt_uvr"></b><div class="hint" id="mtUvr"></div></div>
        <button type="button" class="btn ghost" id="mtUvrBtn" data-i18n="mt_run"></button></div>
    </form>
  </dialog>

  <div class="sd-bar" id="sdBar" role="alertdialog" hidden>
    <span id="sdText"></span><button type="button" class="btn primary" id="sdCancel" data-i18n="sd_cancel"></button>
  </div>

  <div class="drop-veil" id="dropVeil" hidden><div data-i18n="drop_here"></div></div>

  <dialog id="media" aria-labelledby="mediaTitle">
    <form method="dialog" class="settings-form" id="mediaForm">
      <header class="dialog-head">
        <h2 id="mediaTitle" data-i18n="m_title"></h2>
        <button class="icon-btn" value="close" data-i18n-title="close" aria-label="close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </header>
      <div class="m-info">
        <img id="mThumb" alt="" hidden>
        <div><div id="mName" class="m-name"></div><div id="mSub" class="hint"></div></div>
      </div>

      <fieldset id="mListBox" hidden>
        <legend data-i18n="m_playlist"></legend>
        <label class="check" id="mOnlyRow" hidden><input type="checkbox" id="mOnly"><span data-i18n="m_only_this"></span></label>
        <label class="check"><input type="checkbox" id="mAll" checked><span data-i18n="m_select_all"></span> <b id="mCount"></b></label>
        <ul class="m-entries" id="mEntries"></ul>
      </fieldset>

      <fieldset>
        <legend data-i18n="m_format"></legend>
        <div class="row">
          <span class="seg">
            <label><input type="radio" name="format" value="mp4" checked><span>MP4</span></label>
            <label><input type="radio" name="format" value="mp3"><span>MP3</span></label>
          </span>
          <select name="quality" id="mQuality"></select>
          <select name="audio_kbps" id="mKbps" hidden>
            <option value="320">320 kbps</option><option value="256">256 kbps</option>
            <option value="192">192 kbps</option><option value="128">128 kbps</option>
          </select>
        </div>
      </fieldset>

      <fieldset>
        <legend data-i18n="m_options"></legend>
        <label class="check" id="mSubsRow"><input type="checkbox" name="subs"><span data-i18n="m_subs"></span></label>
        <label class="check"><input type="checkbox" name="embed"><span data-i18n="m_embed"></span></label>
        <label class="row"><span data-i18n="m_sponsor"></span>
          <select name="sponsorblock">
            <option value="mark" data-i18n="m_sb_mark"></option>
            <option value="remove" data-i18n="m_sb_remove"></option>
            <option value="off" data-i18n="m_sb_off"></option>
          </select>
        </label>
        <div class="row" id="mRangeRow"><span data-i18n="m_range"></span>
          <span class="m-range"><input type="text" name="start" placeholder="0:00" spellcheck="false"> – <input type="text" name="end" data-i18n-placeholder="m_end" spellcheck="false"></span>
        </div>
      </fieldset>
      <div class="m-actions">
        <button type="button" class="btn primary" id="mGo" data-i18n="add_button"></button>
      </div>
    </form>
  </dialog>

  <dialog id="cloud" aria-labelledby="cloudTitle">
    <form method="dialog" class="settings-form" id="cloudForm">
      <header class="dialog-head">
        <h2 id="cloudTitle" data-i18n="c_title"></h2>
        <button class="icon-btn" value="close" data-i18n-title="close" aria-label="close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </header>
      <div class="m-info"><div><div id="cName" class="m-name"></div><div id="cSub" class="hint"></div></div></div>
      <fieldset>
        <label class="check"><input type="checkbox" id="cAll" checked><span data-i18n="m_select_all"></span> <b id="cCount"></b></label>
        <ul class="m-entries c-tree" id="cEntries"></ul>
      </fieldset>
      <div class="m-actions">
        <button type="button" class="btn primary" id="cGo" data-i18n="add_button"></button>
      </div>
    </form>
  </dialog>

  <dialog id="rdAsk" aria-labelledby="rdAskTitle">
    <form method="dialog" class="settings-form">
      <header class="dialog-head">
        <h2 id="rdAskTitle" data-i18n="rd_ask_title"></h2>
        <button class="icon-btn" value="close" data-i18n-title="close" aria-label="close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </header>
      <p class="rd-ask-url" id="rdAskUrl"></p>
      <p class="hint" data-i18n="rd_ask_body"></p>
      <div class="m-actions rd-ask-actions">
        <button type="button" class="btn" id="rdAskDirect" data-i18n="rd_ask_direct"></button>
        <button type="button" class="btn primary" id="rdAskRd" data-i18n="rd_ask_rd"></button>
      </div>
    </form>
  </dialog>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
  <script src="rd.js"></script>
  <script src="extras.js"></script>
  <script src="i18n6.js"></script>
  <script src="media6.js"></script>
  <script src="use6.js"></script>
  <script src="plugins.js"></script>
  <script src="eye/kami_eye.js"></script>
  <script src="sunak.js"></script>
  <script src="settings-tabs.js"></script>
  <script src="palette.js"></script>
  <script src="sunak-extra.js"></script>
  <script src="convert.js"></script>
</body>
