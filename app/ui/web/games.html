<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Kami Oyun</title>
<style>
  :root{--bg:#08070C;--card:#130E1D;--line:#2E2346;--tx:#EDE9F6;--mut:#9E96B8;--ac:#9D6BFF;--em:#2EE6A6}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:14px "Chakra Petch","Segoe UI",sans-serif;padding:18px 22px}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .top h1{margin:0;font-size:18px;letter-spacing:.6px;color:#C4B5FD}
  .top input{flex:1;min-width:180px;max-width:300px;background:#110D19;border:1px solid var(--line);border-radius:9px;color:var(--tx);padding:8px 12px;font:inherit}
  .btn{border:1px solid var(--line);background:#1A1328;color:var(--tx);border-radius:9px;padding:7px 12px;cursor:pointer;font:600 12.5px inherit}
  .btn:hover{border-color:var(--ac)} .btn.pri{background:#6D28D9;border-color:var(--ac)} .btn.on{border-color:var(--em);color:var(--em)}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;padding:10px 12px;background:#100C18;border:1px solid var(--line);border-radius:10px;font-size:12px}
  .bar label{display:flex;align-items:center;gap:6px;cursor:pointer}
  .cfg{display:grid;gap:8px;margin-bottom:14px;padding:12px;background:#110D19;border:1px solid var(--line);border-radius:10px;font-size:12px}
  .cfg[hidden]{display:none}
  .cfg .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .cfg input{background:#09070F;border:1px solid var(--line);border-radius:7px;color:var(--tx);padding:6px 10px;font:inherit;min-width:200px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:14px}
  .gcard{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:transform .14s,border-color .14s}
  .gcard:hover{transform:translateY(-2px);border-color:var(--ac)}
  .gcard.uninst{opacity:.78}
  .cov{aspect-ratio:2/3;background:linear-gradient(135deg,#1A122B,#0C0914);display:grid;place-items:center;position:relative;overflow:hidden}
  .cov img{width:100%;height:100%;object-fit:cover;display:block}
  .badges{position:absolute;top:7px;right:7px;display:flex;gap:4px;flex-wrap:wrap}
  .bdg{font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;background:rgba(8,7,12,.85);border:1px solid rgba(157,107,255,.45);color:#EDE9F6}
  .bdg.em{border-color:var(--em);color:var(--em)}
  .body{padding:10px;display:grid;gap:6px;flex:1}
  .body b{font-size:13px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pt{font-size:11px;color:var(--mut)}
  .acts{display:flex;gap:6px;margin-top:auto}
  .acts button{flex:1;padding:6px 8px;font-size:11.5px;border-radius:7px}
  .msg{color:var(--mut);padding:24px;text-align:center}
</style>
<script src="kami-embed.js"></script>
</head>
<body>
  <div class="top">
    <h1>🎮 KAMI OYUN</h1>
    <input id="q" placeholder="Oyun ara…">
    <button class="btn on" id="fInst">Kurulu</button>
    <button class="btn" id="fAll">Tümü</button>
    <button class="btn" id="rescan">↻ Tara</button>
    <button class="btn" id="cfgBtn">⚙ API / İzleyici</button>
    <span id="cnt" style="color:var(--mut);font-size:12px"></span>
  </div>
  <div class="bar">
    <span id="liveGame" style="color:var(--em)">Durum: Hazır</span>
    <span style="flex:1"></span>
    <label><input type="checkbox" id="autoReplay"> Oyun açılınca Replay Buffer başlat</label>
  </div>
  <div class="cfg" id="cfgBox" hidden>
    <div class="row">
      <input id="sgdbIn" type="password" placeholder="SteamGridDB API Anahtarı (kapaklar için)">
      <button class="btn pri" id="sgdbSave">Kaydet</button>
    </div>
    <div class="row">
      <input id="swKey" type="password" placeholder="Steam Web API Anahtarı">
      <input id="swId" placeholder="SteamID64 (kurulu olmayan oyunlar)">
      <button class="btn pri" id="swSave">Steam Bağla</button>
    </div>
  </div>
  <div class="grid" id="grid"></div>
  <script>
    const api = () => window.pywebview?.api;
    let GAMES = [], SHOW_ALL = false;
    const esc = (s) => String(s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const fmtPt = (sec) => { const m = Math.floor((sec || 0) / 60); return m >= 60 ? `${(m / 60).toFixed(1)} sa` : m > 0 ? `${m} dk` : ""; };
    function render() {
      const q = document.getElementById("q").value.trim().toLowerCase();
      const list = GAMES.filter((g) => (SHOW_ALL || g.installed) && (!q || g.title.toLowerCase().includes(q)));
      document.getElementById("cnt").textContent = `${list.length} oyun`;
      const grid = document.getElementById("grid");
      if (!list.length) { grid.innerHTML = `<div class="msg">Eşleşen oyun bulunamadı.</div>`; return; }
      grid.innerHTML = list.map((g) => {
        const pt = fmtPt(g.playtime_sec);
        return `
        <div class="gcard ${g.installed ? "" : "uninst"}" data-key="${esc(g.key)}">
          <div class="cov">${g.cover ? `<img src="${esc(g.cover)}" loading="lazy" onerror="this.remove()">` : ""}<span style="font-size:28px;opacity:.45">🎮</span>
            <div class="badges">${g.stores.map((s) => `<span class="bdg">${esc(s.store)}</span>`).join("")}${g.installed ? "" : `<span class="bdg em">Kütüphane</span>`}</div>
          </div>
          <div class="body">
            <b>${esc(g.title)}</b>
            ${pt ? `<div class="pt">⏱ ${pt}</div>` : ""}
            <div class="acts">
              <button class="btn pri" data-play="${esc(g.key)}">${g.installed ? "▶ Oyna" : "⬇ Kur"}</button>
              <button class="btn" data-save="${esc(g.key)}" title="Ludusavi ile save yedeği">💾</button>
            </div>
          </div>
        </div>`;
      }).join("");
    }
    async function load() {
      document.getElementById("grid").innerHTML = `<div class="msg">Kütüphane taranıyor…</div>`;
      const r = await api()?.games_list?.(true).catch(() => null);
      GAMES = r?.games || [];
      render();
      refreshStatus();
    }
    async function refreshStatus() {
      const st = await api()?.games_tracker_status?.().catch(() => null);
      if (!st) return;
      document.getElementById("autoReplay").checked = !!st.auto_replay;
      document.getElementById("liveGame").textContent = st.active_title ? `🎮 Oynanıyor: ${st.active_title}` : "Durum: Boşta (arka plan izleyicisi aktif)";
    }
    document.getElementById("q").oninput = render;
    document.getElementById("rescan").onclick = load;
    document.getElementById("fInst").onclick = () => { SHOW_ALL = false; fInst.classList.add("on"); fAll.classList.remove("on"); render(); };
    document.getElementById("fAll").onclick = () => { SHOW_ALL = true; fAll.classList.add("on"); fInst.classList.remove("on"); render(); };
    document.getElementById("cfgBtn").onclick = () => { cfgBox.hidden = !cfgBox.hidden; };
    document.getElementById("autoReplay").onchange = (e) => api()?.games_set_auto_replay?.(e.target.checked);
    document.getElementById("sgdbSave").onclick = async () => {
      await api()?.games_set_sgdb_key?.(sgdbIn.value); sgdbIn.value = ""; load();
    };
    document.getElementById("swSave").onclick = async () => {
      await api()?.games_set_steam_web?.(swKey.value, swId.value); swKey.value = ""; SHOW_ALL = true; fAll.classList.add("on"); fInst.classList.remove("on"); load();
    };
    document.getElementById("grid").onclick = async (e) => {
      const p = e.target.closest("[data-play]");
      const say = (t) => { const c = document.getElementById("cnt"); c.textContent = t; setTimeout(() => { c.textContent = GAMES.length + " oyun"; }, 6000); };
      if (p) {
        const g = GAMES.find((x) => x.key === p.dataset.play), st = g?.stores?.find((x) => x.launch);
        if (!st) { say(`${g?.title || "Oyun"}: başlatma yolu bulunamadı`); return; }
        const r = await api()?.games_launch?.(st.launch).catch(() => null);
        say(r?.ok ? `▶ ${g.title} başlatılıyor (${st.store})` : `${g.title} başlatılamadı: ${r?.error || "?"}`);
      }
      const s = e.target.closest("[data-save]");
      if (s) {
        const g = GAMES.find((x) => x.key === s.dataset.save); if (!g) return;
        s.textContent = "…";
        const r = await api()?.games_backup_save?.(g.title).catch(() => null);
        s.textContent = r?.ok ? "✓" : "!";
        if (r?.error === "ludusavi_missing") say("Save yedeği için Ludusavi gerekli: PowerShell'de  winget install mtkennerly.ludusavi");
        else if (r?.ok) say(`✓ ${g.title} kaydı yedeklendi`);
      }
    };
    window.addEventListener("pywebviewready", load);
    setTimeout(() => { if (!GAMES.length && window.pywebview) load(); }, 350);
    setInterval(refreshStatus, 10000);
  </script>
</body>
</html>
