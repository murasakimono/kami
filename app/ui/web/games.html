<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Kami Oyun</title>
<style>
  :root{--bg:#08070C;--card:#130E1D;--line:#2E2346;--tx:#EDE9F6;--mut:#9E96B8;--ac:#9D6BFF;--em:#2EE6A6}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:14px "Chakra Petch","Segoe UI",sans-serif;padding:18px 22px}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .top h1{margin:0;font-size:18px;letter-spacing:.6px;color:#C4B5FD}
  .top input{flex:1;min-width:200px;max-width:340px;background:#110D19;border:1px solid var(--line);border-radius:9px;color:var(--tx);padding:8px 12px;font:inherit}
  .btn{border:1px solid var(--line);background:#1A1328;color:var(--tx);border-radius:9px;padding:8px 13px;cursor:pointer;font:600 12.5px inherit}
  .btn:hover{border-color:var(--ac)} .btn.pri{background:#6D28D9;border-color:var(--ac)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:14px}
  .gcard{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:transform .14s,border-color .14s}
  .gcard:hover{transform:translateY(-2px);border-color:var(--ac)}
  .cov{aspect-ratio:2/3;background:linear-gradient(135deg,#1A122B,#0C0914);display:grid;place-items:center;position:relative;overflow:hidden}
  .cov img{width:100%;height:100%;object-fit:cover;display:block}
  .badges{position:absolute;top:7px;right:7px;display:flex;gap:4px;flex-wrap:wrap}
  .bdg{font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;background:rgba(8,7,12,.85);border:1px solid rgba(157,107,255,.45);color:#EDE9F6}
  .body{padding:10px;display:grid;gap:8px;flex:1}
  .body b{font-size:13px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .acts{display:flex;gap:6px;margin-top:auto}
  .acts button{flex:1;padding:6px 8px;font-size:11.5px;border-radius:7px}
  .msg{color:var(--mut);padding:24px;text-align:center}
</style>
<script src="kami-embed.js"></script>
</head>
<body>
  <div class="top">
    <h1>🎮 KAMI OYUN</h1>
    <input id="q" placeholder="Oyun ara…">
    <button class="btn" id="rescan">↻ Tara</button>
    <span id="cnt" style="color:var(--mut);font-size:12px"></span>
  </div>
  <div class="grid" id="grid"></div>
  <script>
    const api = () => window.pywebview?.api;
    let GAMES = [];
    const esc = (s) => String(s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    function render() {
      const q = document.getElementById("q").value.trim().toLowerCase();
      const list = GAMES.filter((g) => !q || g.title.toLowerCase().includes(q));
      document.getElementById("cnt").textContent = `${list.length} oyun`;
      const grid = document.getElementById("grid");
      if (!list.length) { grid.innerHTML = `<div class="msg">Kurulu Steam / Epic / GOG oyunu bulunamadı.</div>`; return; }
      grid.innerHTML = list.map((g, i) => `
        <div class="gcard">
          <div class="cov">${g.cover ? `<img src="${esc(g.cover)}" loading="lazy" onerror="this.remove()">` : ""}<span style="font-size:28px;opacity:.45">🎮</span>
            <div class="badges">${g.stores.map((s) => `<span class="bdg">${esc(s.store)}</span>`).join("")}</div>
          </div>
          <div class="body">
            <b>${esc(g.title)}</b>
            <div class="acts">
              <button class="btn pri" data-play="${i}">▶ Oyna</button>
              <button class="btn" data-save="${i}" title="Ludusavi ile save yedeği">💾</button>
            </div>
          </div>
        </div>`).join("");
    }
    async function load() {
      document.getElementById("grid").innerHTML = `<div class="msg">Kütüphane taranıyor…</div>`;
      const r = await api()?.games_list?.().catch(() => null);
      GAMES = r?.games || [];
      render();
    }
    document.getElementById("q").oninput = render;
    document.getElementById("rescan").onclick = load;
    document.getElementById("grid").onclick = async (e) => {
      const p = e.target.closest("[data-play]");
      if (p) { const g = GAMES[+p.dataset.play]; if (g?.stores?.[0]) api()?.games_launch?.(g.stores[0].launch); }
      const s = e.target.closest("[data-save]");
      if (s) {
        const g = GAMES[+s.dataset.save]; if (!g) return;
        s.textContent = "…";
        const r = await api()?.games_backup_save?.(g.title).catch(() => null);
        s.textContent = r?.ok ? "✓" : "!";
        if (r?.error === "ludusavi_missing") alert("Save yedeği için açık kaynak 'ludusavi' aracının PATH'te olması gerekir.");
      }
    };
    window.addEventListener("pywebviewready", load);
    setTimeout(() => { if (!GAMES.length && window.pywebview) load(); }, 350);
  </script>
</body>
</html>
