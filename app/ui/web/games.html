<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Kami Games</title>
<style>
  @font-face{font-family:"Chakra Petch";src:url("fonts/ChakraPetch-Regular.ttf");font-weight:400}
  @font-face{font-family:"Chakra Petch";src:url("fonts/ChakraPetch-Medium.ttf");font-weight:500}
  @font-face{font-family:"Chakra Petch";src:url("fonts/ChakraPetch-SemiBold.ttf");font-weight:600}
  @font-face{font-family:"Chakra Petch";src:url("fonts/ChakraPetch-Bold.ttf");font-weight:700}
  :root{color-scheme:dark;accent-color:#8B5CF6;--bg:#08070C;--card:#120D1C;--line:#2D2246;--tx:#EDE9F6;--mut:#9E96B8;--ac:#9D6BFF;--em:#2EE6A6}
  *{box-sizing:border-box}
  ::-webkit-scrollbar{width:7px;height:7px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#2A213B;border-radius:99px}
  ::-webkit-scrollbar-thumb:hover{background:#433460}
  body{margin:0;background:radial-gradient(900px 420px at 85% -10%,rgba(109,40,217,.14),transparent 65%),var(--bg);color:var(--tx);font:13.5px "Chakra Petch","Segoe UI",system-ui,sans-serif;padding:20px 24px 32px}
  input,select,button{font-family:inherit}
  .top{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .top h1{margin:0;display:inline-flex;align-items:center;gap:8px;font:700 18px "Chakra Petch",sans-serif;letter-spacing:.9px;color:#D8CCFF}
  .ico{width:15px;height:15px;flex:none;vertical-align:middle}
  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#181226;color:var(--tx);border-radius:10px;padding:7px 11px;cursor:pointer;font:600 12px "Chakra Petch",sans-serif;transition:all .15s}
  .btn:hover{border-color:var(--ac);background:#221936}
  .top input,select{background:#0E0A16;border:1px solid var(--line);border-radius:10px;color:var(--tx);padding:7px 11px;font:inherit;font-size:12.5px;outline:none}
  .top input:focus,select:focus{border-color:var(--ac)}
  .top input{flex:1;min-width:170px;max-width:260px}
  .btn.pri{background:linear-gradient(135deg,#7C3AED,#5B21B6);border-color:#A78BFA;color:#fff}
  .btn.on{border-color:var(--em);color:var(--em);background:rgba(46,230,166,.08)}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;padding:10px 14px;background:rgba(16,12,24,.9);border:1px solid var(--line);border-radius:12px;font-size:12px}
  .bar label{display:flex;align-items:center;gap:6px;cursor:pointer}
  .cfg{display:grid;gap:8px;margin-bottom:14px;padding:13px;background:#110D19;border:1px solid var(--line);border-radius:12px;font-size:12px}
  .cfg[hidden]{display:none}
  .cfg .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .cfg input{background:#09070F;border:1px solid var(--line);border-radius:8px;color:var(--tx);padding:6px 10px;font:inherit;min-width:190px}
  .hero{position:relative;border:1px solid rgba(157,107,255,.38);border-radius:16px;overflow:hidden;margin-bottom:16px;min-height:176px;display:flex;align-items:flex-end;background:linear-gradient(125deg,#1A122E,#0B0813)}
  .hero[hidden]{display:none}
  .hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(14px) brightness(.42) saturate(1.25);transform:scale(1.12);z-index:0;transition:opacity .35s ease}
  .cov-pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;max-height:240px;overflow:auto;padding:4px 0}
  .cov-pick-item{aspect-ratio:2/3;border-radius:8px;overflow:hidden;border:2px solid transparent;cursor:pointer;background:#09070F}
  .cov-pick-item:hover{border-color:var(--em)}
  .cov-pick-item img{width:100%;height:100%;object-fit:cover;display:block}
  .snap-list{display:flex;flex-direction:column;gap:5px;max-height:160px;overflow:auto}
  .snap-row{display:flex;align-items:center;gap:8px;padding:6px 9px;background:#0A0810;border:1px solid var(--line);border-radius:8px;font-size:11.5px}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,7,12,.94) 0%,rgba(8,7,12,.72) 55%,rgba(8,7,12,.38) 100%);z-index:1}
  .hero-in{position:relative;z-index:2;width:100%;display:flex;align-items:center;gap:18px;padding:18px 22px}
  .hero-cov{width:92px;height:136px;border-radius:10px;object-fit:cover;flex:none;border:1px solid rgba(255,255,255,.16);box-shadow:0 12px 30px rgba(0,0,0,.6);background:#120D1C}
  .hero-meta{flex:1;min-width:0;display:grid;gap:6px}
  .hero-tag{font-size:11px;font-weight:700;letter-spacing:1.2px;color:var(--em);text-transform:uppercase}
  .hero-meta h2{margin:0;font-size:22px;line-height:1.15;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hero-sub{font-size:12.5px;color:#C4B5FD;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .hero-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:14px}
  .gcard{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden;display:flex;flex-direction:column;transition:transform .16s,border-color .16s,box-shadow .16s;cursor:pointer;position:relative}
  .gcard:hover{transform:translateY(-3px);border-color:var(--ac);box-shadow:0 10px 26px rgba(109,40,217,.26)}
  .gcard.uninst{opacity:.78}
  .cov{aspect-ratio:2/3;background:linear-gradient(135deg,#1A122B,#0C0914);display:grid;place-items:center;position:relative;overflow:hidden}
  .cov .fb{position:absolute;inset:0;display:grid;place-items:center;font-size:28px;opacity:.45;z-index:0}
  .cov img{width:100%;height:100%;object-fit:cover;display:block;position:relative;z-index:1;background:#0C0914;transition:transform .25s}
  .gcard:hover .cov img{transform:scale(1.04)}
  .gcard{transform-style:preserve-3d;transition:transform .16s ease,border-color .16s ease}
  .gcard.tilting::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.11),transparent 58%);z-index:4}
  .fav-b{position:absolute;top:7px;left:7px;z-index:3;width:26px;height:26px;border-radius:8px;border:1px solid rgba(255,255,255,.14);background:rgba(8,7,12,.78);color:#9E96B8;cursor:pointer;display:grid;place-items:center;font-size:13px;padding:0;transition:all .14s}
  .fav-b:hover,.fav-b.on{color:#F5B94A;border-color:rgba(245,185,74,.6)}
  .badges{position:absolute;top:7px;right:7px;z-index:2;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
  .bdg{font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;background:rgba(8,7,12,.85);border:1px solid rgba(157,107,255,.45);color:#EDE9F6}
  .bdg.em{border-color:var(--em);color:var(--em)}
  .body{padding:10px;display:grid;gap:5px;flex:1}
  .body b{font-size:13px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pt{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .acts{display:flex;gap:6px;margin-top:auto}
  .acts button{flex:1;padding:6px 8px;font-size:11.5px;border-radius:7px}
  .msg{color:var(--mut);padding:24px;text-align:center}
  .mdl{position:fixed;inset:0;background:rgba(5,4,8,.78);display:grid;place-items:center;z-index:50}
  .mdl[hidden]{display:none}
  .mdl-box{width:min(540px,92vw);background:#120E1C;border:1px solid var(--ac);border-radius:14px;padding:18px;display:grid;gap:10px}
</style>
<script src="kami-embed.js"></script>
</head>
<body>
  <div class="top">
    <h1><svg class="ico" style="width:20px;height:20px;color:var(--em)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="10" rx="5"/><path d="M7 10v4M5 12h4M15.5 11h.01M18 13h.01"/></svg> KAMI GAMES</h1>
    <input id="q" placeholder="Oyun ara…">
    <select id="storeSel"><option value="">Tüm Mağazalar</option><option>Steam</option><option>Epic</option><option>GOG</option><option>Riot Games</option><option>Özel</option></select>
    <select id="genreSel"><option value="">Tüm Türler</option></select>
    <button class="btn on" id="fInst">Kurulu</button>
    <button class="btn" id="fAll">Tümü</button>
    <button class="btn" id="fFav">★ Favori</button>
    <button class="btn" id="rndBtn" title="Rastgele oyun seç"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1" fill="currentColor"/></svg></button>
    <button class="btn pri" id="bigPicBtn" title="Tam Ekran Steam Big Picture Konsol Modu">🎮 Big Picture</button>
    <button class="btn" id="compBtn" title="Tek Tuş Oyun Companion Overlay (Alt+G)">🎮 Companion</button>
    <button class="btn" id="cfgBtn" title="Araçlar, Filtreler &amp; API Ayarları"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.77 1.02 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg> Araçlar</button>
    <span id="cnt" style="color:var(--mut);font-size:12px"></span>
  </div>
  <div class="bar" hidden>
    <span id="liveGame" style="color:var(--em)">Durum: Hazır</span>
  </div>
  <div class="cfg" id="cfgBox" hidden>
    <div class="row" style="flex-wrap:wrap;gap:8px;padding-bottom:6px;border-bottom:1px solid var(--line)">
      <button class="btn" id="fRecent">⏱ Son Oynananlar</button>
      <button class="btn" id="fShort">⚡ Kısa Oturum (&lt;2 sa)</button>
      <button class="btn on" id="hideToolsBtn" title="Blender / Wallpaper Engine gibi oyun dışı araçları gizle">Araçları Gizle</button>
      <button class="btn" id="tiltBtn" title="3D Kart Eğimi &amp; Parlama">3D Kart Eğimi</button>
      <button class="btn" id="plImpBtn" title="Playnite veritabanından Epic/GOG/Riot/Türleri aktar"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Playnite Aktar</button>
      <button class="btn" id="rescan" title="Kütüphaneyi yeniden tara"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg> Yeniden Tara</button>
      <label style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);margin-left:auto"><input type="checkbox" id="autoReplay"> Oyun açılınca Replay Buffer başlat</label>
    </div>
    <div class="row">
      <input id="sgdbIn" type="password" placeholder="SteamGridDB API Anahtarı (kapaklar için)">
      <button class="btn pri" id="sgdbSave">Kaydet</button>
    </div>
    <div class="row">
      <input id="swKey" type="password" placeholder="Steam Web API Anahtarı">
      <input id="swId" placeholder="SteamID64 (kurulu olmayan oyunlar)">
      <button class="btn pri" id="swSave">Steam Bağla</button>
    </div>
    <div class="row">
      <input id="custTitle" placeholder="Özel oyun adı (Emülatör / diğer)">
      <input id="custExe" placeholder=".exe veya .lnk tam yolu">
      <button class="btn pri" id="custAdd">+ Ekle</button>
    </div>
    <div class="row">
      <input id="shelfDirIn" placeholder="Mağazasız oyun klasörü (ör: C:\Games veya D:\Oyunlar)" style="flex:1">
      <button class="btn pri" id="shelfScanBtn">📂 Klasörü Tara & Ekle (Shelf)</button>
    </div>
  </div>
  <div class="hero" id="hero" hidden></div>
  <div class="grid" id="grid"></div>
  <div class="mdl" id="detMdl" hidden>
    <div class="mdl-box" id="detBody"></div>
  </div>
  <script>
    const api = () => window.pywebview?.api;
    let GAMES = [], MODE = "inst", HIDE_TOOLS = true;
    const esc = (s) => String(s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const fmtPt = (sec) => { const m = Math.floor((sec || 0) / 60); return m >= 60 ? `${(m / 60).toFixed(1)} sa` : m > 0 ? `${m} dk` : ""; };
    const fmtAgo = (ts) => {
      if (!ts) return "";
      const d = Math.max(0, Math.floor(Date.now() / 1000 - ts));
      return d < 120 ? "Az önce" : d < 3600 ? `${Math.floor(d / 60)} dk önce` : d < 86400 ? `${Math.floor(d / 3600)} sa önce` : `${Math.floor(d / 86400)} gün önce`;
    };
    const pickStore = (g) => (g?.stores || []).find((s) => s.installed) || g?.stores?.[0];

    function renderHero() {
      const heroEl = document.getElementById("hero");
      const inst = GAMES.filter((g) => g.installed);
      if (!inst.length || q.value.trim() || storeSel.value || genreSel.value) { heroEl.hidden = true; return; }
      const pick = inst.slice().sort((a, b) => (b.last_played || 0) - (a.last_played || 0) || (b.playtime_sec || 0) - (a.playtime_sec || 0))[0];
      if (!pick) { heroEl.hidden = true; return; }
      const st = pickStore(pick);
      const pt = fmtPt(pick.playtime_sec), ago = fmtAgo(pick.last_played);
      heroEl.hidden = false;
      heroEl.innerHTML = `
        ${pick.cover ? `<img class="hero-bg" src="${esc(pick.cover)}" alt="" onerror="kgCovErr(this)">` : ""}
        <div class="hero-in">
          ${pick.cover ? `<img class="hero-cov" src="${esc(pick.cover)}" alt="" onerror="kgCovErr(this)">` : ""}
          <div class="hero-meta">
            <span class="hero-tag">${ago ? `▶ Devam Et · Son oynanan: ${esc(ago)}` : "▶ Hızlı Başlat · Öne Çıkan Oyun"}</span>
            <h2>${esc(pick.title)}</h2>
            <div class="hero-sub">
              ${pick.stores.map((s) => `<span class="bdg">${esc(s.store)}</span>`).join("")}
              ${pt ? `<span>⏱ ${pt}</span>` : ""}
              ${(pick.genres || []).length ? `<span>· ${esc(pick.genres.slice(0, 3).join(", "))}</span>` : ""}
            </div>
            <div class="hero-acts">
              ${st ? `<button class="btn pri" id="heroPlay">▶ Hemen Oyna (${esc(st.store)})</button>` : ""}
              <button class="btn" id="heroSave"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Save Yedeği</button>
              <button class="btn" id="heroDet">Detaylar</button>
            </div>
          </div>
        </div>`;
      heroEl.querySelector("#heroPlay")?.addEventListener("click", () => st && api()?.games_launch?.(st.launch, pick.key));
      heroEl.querySelector("#heroSave")?.addEventListener("click", (ev) => { ev.target.textContent = "…"; api()?.games_backup_save?.(pick.title).then((r) => { ev.target.textContent = r?.ok ? "✓ Yedeklendi" : "✗ Hata"; }); });
      heroEl.querySelector("#heroDet")?.addEventListener("click", () => openDetail(pick));
    }

    function filtered() {
      const qv = q.value.trim().toLowerCase(), st = storeSel.value, gn = genreSel.value;
      const list = GAMES.filter((g) => {
        if (HIDE_TOOLS && g.is_tool) return false;
        if (MODE === "inst" && !g.installed) return false;
        if (MODE === "fav" && !g.favorite) return false;
        if (MODE === "recent" && !g.last_played) return false;
        if (MODE === "short" && !(g.playtime_sec > 0 && g.playtime_sec <= 7200)) return false;
        if (st && !g.stores.some((s) => s.store === st)) return false;
        if (gn && !(g.genres || []).includes(gn)) return false;
        if (qv && !g.title.toLowerCase().includes(qv)) return false;
        return true;
      });
      if (MODE === "recent") list.sort((a, b) => (b.last_played || 0) - (a.last_played || 0));
      return list;
    }

    function render() {
      renderHero();
      const list = filtered();
      cnt.textContent = `${list.length} oyun`;
      if (!list.length) { grid.innerHTML = `<div class="msg">Eşleşen oyun bulunamadı.</div>`; return; }
      const paint = () => {
        grid.innerHTML = list.map((g) => {
          const pt = fmtPt(g.playtime_sec);
          const gn = (g.genres || []).slice(0, 2).join(" · ");
          return `
        <div class="gcard ${g.installed ? "" : "uninst"}" data-key="${esc(g.key)}">
          <div class="cov">${g.cover ? `<img src="${esc(g.cover)}" loading="lazy" onerror="kgCovErr(this)">` : ""}<span class="fb"><svg class="ico" style="width:28px;height:28px;opacity:.45" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="10" rx="5"/><path d="M7 10v4M5 12h4M15.5 11h.01M18 13h.01"/></svg></span>
            <button class="fav-b ${g.favorite ? "on" : ""}" data-fav="${esc(g.key)}" title="Favori">${g.favorite ? "★" : "☆"}</button>
            <div class="badges">${g.stores.map((s) => `<span class="bdg">${esc(s.store)}</span>`).join("")}${g.installed ? "" : `<span class="bdg em">Kütüphane</span>`}</div>
          </div>
          <div class="body">
            <b>${g.favorite ? "★ " : ""}${esc(g.title)}</b>
            ${(pt || gn) ? `<div class="pt">${pt ? pt : ""}${pt && gn ? " · " : ""}${esc(gn)}</div>` : ""}
            <div class="acts">
              <button class="btn pri" data-play="${esc(g.key)}">${g.installed ? "▶ Oyna" : "⬇ Kur"}</button>
              <button class="btn" data-save="${esc(g.key)}" title="Ludusavi ile save yedeği"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Save</button>
            </div>
          </div>
        </div>`;
        }).join("");
      };
      if (window.KamiMotion?.flip && grid.querySelector(".gcard")) KamiMotion.flip(grid, paint, ".gcard");
      else { paint(); window.KamiMotion?.cascade?.(grid, ".gcard"); }
    }

    async function openDetail(g) {
      if (!g) return;
      const pt = fmtPt(g.playtime_sec) || "0 dk";
      detBody.innerHTML = `
        <div style="display:flex;align-items:center;gap:10px">
          <b style="font-size:16px;flex:1">${esc(g.title)}</b>
          <button class="btn" id="detX">✕</button>
        </div>
        <div style="font-size:12px;color:var(--mut)">⏱ Süre: ${pt} · Türler: ${esc((g.genres || []).join(", ") || "—")}</div>
        ${(g.categories || []).length ? `<div style="font-size:12px;color:var(--mut)">Koleksiyon: ${esc(g.categories.join(", "))}</div>` : ""}
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          ${g.stores.map((s) => `<button class="btn pri" data-mplay="${esc(s.launch)}">▶ ${esc(s.store)} ${s.installed ? "Başlat" : "Kur"}</button>`).join("")}
          <button class="btn" id="detSave"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Save Yedeği</button>
          <button class="btn" id="detSnapBtn">+ Anlık Snapshot</button>
          <button class="btn" id="detCovBtn">🖼 Kapak Seç</button>

      bpEl.hidden = !BIG_PIC;
      bigPicBtn?.classList.toggle("on", BIG_PIC);
      await api()?.games_fullscreen?.(BIG_PIC)?.catch?.(() => {});
      if (BIG_PIC) {
        try { document.documentElement.requestFullscreen?.()?.catch?.(() => {}); } catch {}
        renderBigPicture();
      } else {
        try { if (document.fullscreenElement) document.exitFullscreen?.()?.catch?.(() => {}); } catch {}
      }
    }

    const bigPicBtn = document.getElementById("bigPicBtn");
    bigPicBtn?.addEventListener("click", () => toggleBigPicture());

    document.addEventListener("keydown", (e) => {
      if (!BIG_PIC || !detMdl.hidden) return;
      if (e.key === "Escape" || e.key === "Backspace") { e.preventDefault(); toggleBigPicture(false); }
      else if (e.key === "ArrowRight") { e.preventDefault(); highlightGpCard(gpFocusIdx + 1); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); highlightGpCard(gpFocusIdx - 1); }
      else if (e.key === "ArrowDown") { e.preventDefault(); highlightGpCard(gpFocusIdx + 5); }
      else if (e.key === "ArrowUp") { e.preventDefault(); highlightGpCard(gpFocusIdx - 5); }
      else if (e.key === "Enter") { e.preventDefault(); bpEl.querySelector("#bpPlayBtn")?.click(); }
      else if (e.key === " ") { e.preventDefault(); bpEl.querySelector("#bpDetBtn")?.click(); }
      else if (e.key === "r" || e.key === "R") { e.preventDefault(); bpEl.querySelector("#bpRndBtn")?.click(); }
    });
    function pollGamepad() {
      const pads = navigator.getGamepads ? navigator.getGamepads() : [];
      const gp = pads && (pads[0] || pads[1] || pads[2] || pads[3]);
      if (gp && Date.now() - lastGpStep > 190) {
        const axX = gp.axes?.[0] || 0, axY = gp.axes?.[1] || 0;
        const left = gp.buttons?.[14]?.pressed || axX < -0.55;
        const right = gp.buttons?.[15]?.pressed || axX > 0.55;
        const up = gp.buttons?.[12]?.pressed || axY < -0.55;
        const down = gp.buttons?.[13]?.pressed || axY > 0.55;
        const btnA = gp.buttons?.[0]?.pressed;
        const btnB = gp.buttons?.[1]?.pressed;
        const btnY = gp.buttons?.[3]?.pressed;
        if (left || right || up || down || btnA || btnB || btnY) {
          lastGpStep = Date.now();
          const cols = Math.max(1, Math.round((document.getElementById("grid")?.clientWidth || 900) / (BIG_PIC ? 245 : 186)));
          if (left) highlightGpCard(gpFocusIdx - 1);
          else if (right) highlightGpCard(gpFocusIdx + 1);
          else if (up) highlightGpCard(gpFocusIdx - cols);
          else if (down) highlightGpCard(gpFocusIdx + cols);
          else if (btnA) {
            const card = document.querySelectorAll("#grid .gcard")[gpFocusIdx];
            if (card) {
              const g = GAMES.find((x) => x.key === card.dataset.key);
              const st = pickStore(g);
              if (st) api()?.games_launch?.(st.launch, g.key);
            }
          } else if (btnY) {
            const card = document.querySelectorAll("#grid .gcard")[gpFocusIdx];
            if (card) openDetail(GAMES.find((x) => x.key === card.dataset.key));
          } else if (btnB) {
            if (!detMdl.hidden) detMdl.hidden = true;
            else if (BIG_PIC) bigPicBtn?.click();
          }
        }
      }
      requestAnimationFrame(pollGamepad);
    }
    requestAnimationFrame(pollGamepad);

    // Dalga 5: Tek Tus Games Companion Overlay (Alt+G) & F9 Time-Machine
    async function openCompanionOverlay(gameObj) {
      const g = gameObj || GAMES[0] || { key: "default", title: "Oyun Companion" };
      detBody.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <h3 style="margin:0">🎮 ${esc(g.title)} — Companion Overlay</h3>
          <button class="btn" onclick="detMdl.hidden=true">✕</button>
        </div>
        <div style="display:grid;gap:10px">
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn pri" id="cmpHltb">⏱ HLTB &amp; PCGamingWiki</button>
            <button class="btn" id="cmpOcr">🔤 Bölge Kilitli OCR Çeviri</button>
            <button class="btn" id="cmpNote">📝 Hızlı Notlar</button>
          </div>
          <div id="cmpInfo" style="font-size:12px;color:var(--mut)"></div>
          <div style="border-top:1px solid var(--line);padding-top:8px;display:grid;gap:6px">
            <b>Hızlı Oyun Notları &amp; Save Editörü / .ini Düzeltici</b>
            <div style="display:flex;gap:6px">
              <input id="cmpNoteIn" placeholder="Bu oyun için hızlı not ekle…" style="flex:1">
              <button class="btn" id="cmpNoteAdd">+ Not</button>
            </div>
            <div style="display:flex;gap:6px">
              <input id="cmpSavePath" placeholder="Save / Config (.json, .ini) yolu…" style="flex:1">
              <button class="btn" id="cmpSavePick">📂</button>
              <button class="btn" id="cmpSaveLoad">Oku</button>
              <button class="btn" id="cmpFixIni">1-Tık .ini Düzelt</button>
            </div>
            <textarea id="cmpSaveTxt" rows="4" placeholder="Save içeriği burada görünür…" style="width:100%;font-family:monospace;font-size:12px"></textarea>
            <div style="display:flex;gap:6px;flex-wrap:wrap">
              <button class="btn pri" id="cmpSaveWrite">Kaydet (.bak yedekli)</button>
              <button class="btn" id="cmpSnap">⏱ Time-Machine Yedek (F9)</button>
              <button class="btn" id="cmpSnapList">Yedekleri Gör</button>
            </div>
            <div id="cmpSnapBox" style="display:flex;gap:6px;flex-wrap:wrap"></div>
          </div>
          <div style="border-top:1px solid var(--line);padding-top:8px;display:grid;gap:6px">
            <b>Kami Mod (1-Tık Rollback) &amp; Harici Offline Araç</b>
            <div style="display:flex;gap:6px;flex-wrap:wrap">
              <input id="cmpGameDir" placeholder="Oyun klasörü…" style="flex:1">
              <input id="cmpModZip" placeholder="Mod / Yama .zip yolu…" style="flex:1">
              <button class="btn" id="cmpModPick">📂</button>
              <button class="btn pri" id="cmpModInst">Kur</button>
              <button class="btn" id="cmpModRoll" disabled>Rollback</button>
            </div>
            <div style="display:flex;gap:6px">
              <input id="cmpToolExe" placeholder="Harici offline araç / trainer .exe yolu…" style="flex:1">
              <button class="btn" id="cmpToolPick">📂</button>
              <button class="btn" id="cmpToolGo">Başlat</button>
            </div>
          </div>
        </div>`;
      detMdl.hidden = false;

      let lastBackupDir = "";
      detBody.querySelector("#cmpHltb").onclick = async () => {
        const info = detBody.querySelector("#cmpInfo");
        info.textContent = "HLTB ve PCGamingWiki sorgulanıyor…";
        const [h, w] = await Promise.all([
          api()?.games_hltb_real?.(g.title).catch(() => null),
          api()?.games_pcgamingwiki?.(g.title).catch(() => null),
        ]);
        const hTxt = h?.main_hours ? `HLTB Ana Hikaye: ${h.main_hours} sa · %100: ${h.completionist_hours || "—"} sa` : `HLTB: <a href="${esc(h?.url || "#")}" target="_blank">Ara</a>`;
        const wTxt = w?.url ? `<a href="${esc(w.url)}" target="_blank">PCGamingWiki</a> · <a href="${esc(w.map_url || "#")}" target="_blank">Harita</a> · <a href="${esc(w.youtube_url || "#")}" target="_blank">YouTube Rehber</a>` : "";
        info.innerHTML = `${hTxt}<br>${wTxt}`;
      };
      detBody.querySelector("#cmpOcr").onclick = async () => {
        const info = detBody.querySelector("#cmpInfo");
        info.textContent = "Alt yazı bölgesi okunuyor…";
        const r = await api()?.games_ocr_translate?.([0.15, 0.74, 0.70, 0.22], "en").catch(() => null);
        info.textContent = r?.skipped ? "HUD/plaka elendi, altyazı bulunamadı." : (r?.translated ? `TR: ${r.translated}` : "OCR sonucu yok.");
      };
      detBody.querySelector("#cmpSaveLoad").onclick = async () => {
        const p = detBody.querySelector("#cmpSavePath").value.trim();
        const r = await api()?.games_save_inspect?.(p).catch(() => null);
        if (r?.ok) detBody.querySelector("#cmpSaveTxt").value = r.text || r.hex_preview || "";
      };
      detBody.querySelector("#cmpSaveWrite").onclick = async () => {
        const p = detBody.querySelector("#cmpSavePath").value.trim();
        const r = await api()?.games_save_write?.(p, detBody.querySelector("#cmpSaveTxt").value).catch(() => null);
        detBody.querySelector("#cmpInfo").textContent = r?.ok ? "✓ Save kaydedildi (.bak yedekli)" : ("Hata: " + (r?.error || "?"));
      };
      detBody.querySelector("#cmpFixIni").onclick = async () => {
        const p = detBody.querySelector("#cmpSavePath").value.trim();
        const r = await api()?.games_fix_ini?.(p).catch(() => null);
        detBody.querySelector("#cmpInfo").textContent = r?.ok ? "✓ .ini düzeltildi: " + (r.applied || []).join(", ") : ("Hata: " + (r?.error || "?"));
      };
      detBody.querySelector("#cmpSnap").onclick = async () => {
        const p = detBody.querySelector("#cmpSavePath").value.trim();
        const r = await api()?.games_snapshot_save?.(g.key || g.title, p).catch(() => null);
        detBody.querySelector("#cmpInfo").textContent = r?.ok ? "✓ Time-Machine yedeği alındı: " + r.id : ("Hata: " + (r?.error || "?"));
      };
      detBody.querySelector("#cmpSavePick").onclick = async () => { const f = await api()?.choose_files?.([".json", ".ini", ".cfg", ".txt", ".sav"]); if (f?.[0]) detBody.querySelector("#cmpSavePath").value = f[0]; };
      detBody.querySelector("#cmpModPick").onclick = async () => { const f = await api()?.choose_files?.([".zip"]); if (f?.[0]) detBody.querySelector("#cmpModZip").value = f[0]; };
      detBody.querySelector("#cmpToolPick").onclick = async () => { const f = await api()?.choose_files?.([".exe"]); if (f?.[0]) detBody.querySelector("#cmpToolExe").value = f[0]; };
      detBody.querySelector("#cmpNoteAdd").onclick = async () => {
        const inp = detBody.querySelector("#cmpNoteIn");
        const txt = inp.value.trim(); if (!txt) return;
        await api()?.scratchpad_add?.(txt, "games", g.title, "");
        inp.value = "";
        detBody.querySelector("#cmpNote").click();
      };
      detBody.querySelector("#cmpSnapList").onclick = async () => {
        const r = await api()?.games_tm_list?.(g.key || g.title).catch(() => null);
        const box = detBody.querySelector("#cmpSnapBox");
        const snaps = r?.snapshots || [];
        if (!snaps.length) { detBody.querySelector("#cmpInfo").textContent = "Yedek yok"; box.innerHTML = ""; return; }
        box.innerHTML = snaps.slice(0, 6).map((s) => `<button class="btn" data-rsnap="${esc(s.path)}">↺ ${esc(s.id)}</button>`).join("");
        box.querySelectorAll("[data-rsnap]").forEach((btn) => {
          btn.onclick = async () => {
            const dst = detBody.querySelector("#cmpSavePath").value.trim();
            if (!dst) { detBody.querySelector("#cmpInfo").textContent = "Geri yüklemek için hedef save yolunu gir."; return; }
            const rr = await api()?.games_tm_restore?.(btn.dataset.rsnap, dst).catch(() => null);
            detBody.querySelector("#cmpInfo").textContent = rr?.ok ? `✓ Geri yüklendi → ${rr.restored_to}` : ("Hata: " + (rr?.error || "?"));
          };
        });
      };
      detBody.querySelector("#cmpModInst").onclick = async () => {
        const r = await api()?.games_mod_install?.(g.key || g.title, detBody.querySelector("#cmpGameDir").value.trim(), detBody.querySelector("#cmpModZip").value.trim()).catch(() => null);
        if (r?.ok) { lastBackupDir = r.backup_dir; detBody.querySelector("#cmpModRoll").disabled = false; detBody.querySelector("#cmpInfo").textContent = `✓ Mod kuruldu (${r.overwritten} üzerine yazılan yedeklendi)`; }
      };
      detBody.querySelector("#cmpModRoll").onclick = async () => {
        if (!lastBackupDir) return;
        const r = await api()?.games_mod_rollback?.(lastBackupDir).catch(() => null);
        detBody.querySelector("#cmpInfo").textContent = r?.ok ? `✓ Rollback tamamlandı (${r.restored} geri yüklendi)` : "Rollback hatası";
      };
      detBody.querySelector("#cmpToolGo").onclick = async () => {
        const r = await api()?.games_launch_tool?.(detBody.querySelector("#cmpToolExe").value.trim()).catch(() => null);
        detBody.querySelector("#cmpInfo").textContent = r?.ok ? "✓ Harici araç başlatıldı" : ("Hata: " + (r?.error || "?"));
      };
      detBody.querySelector("#cmpNote").onclick = async () => {
        const r = await api()?.scratchpad_load?.().catch(() => null);
        const notes = (r?.notes || []).filter((n) => n.context === "games");
        detBody.querySelector("#cmpInfo").textContent = notes.map((n) => "• " + n.text).join(" | ") || "Oyun notu yok";
      };
    }

    document.getElementById("compBtn")?.addEventListener("click", () => openCompanionOverlay(GAMES[0]));
    document.addEventListener("keydown", (e) => {
      if (e.altKey && e.key.toLowerCase() === "g") { e.preventDefault(); openCompanionOverlay(GAMES[0]); }
      if (e.key === "F9" && !detMdl.hidden) { detBody.querySelector("#cmpSnap")?.click(); }
    });
  </script>
</body>
</html>
