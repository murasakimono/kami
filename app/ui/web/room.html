<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#07060B">
<title>Kami Oda</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="s/icon-192.png">
<link rel="icon" href="s/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kami Oda">
<link rel="stylesheet" href="s/room.css">
</head>
<body>
<section class="jn" id="join">
  <div class="jn-box">
    <div class="jn-sigil"><i></i><i></i><i></i><b>KAMI</b></div>
    <h1>Oda</h1>
    <p id="jnTxt">Sesli odaya davet edildin.</p>
    <input id="jnName" placeholder="Adın" maxlength="40" autocomplete="nickname">
    <input id="jnPw" type="password" placeholder="Oda şifresi" maxlength="64" autocomplete="current-password" hidden>
    <select id="jnMic"><option value="">Varsayılan mikrofon</option></select>
    <button id="jnGo">Odaya gir</button>
    <small id="jnErr"></small>
  </div>
</section>

<section class="rm" id="room" hidden>
  <header class="rm-top">
    <span class="rm-logo">KAMI <b>ODA</b></span>
    <span class="rm-count" id="rmCount"></span>
    <span class="rm-net" id="rmNet" title="Bağlantı"></span>
    <span class="sp"></span>
    <div class="rm-invite" id="rmInvite" hidden><input id="rmUrl" readonly><button id="rmCopy">Kopyala</button></div>
    <button class="rm-ib" id="rmChatBtn" title="Sohbet"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg><em id="rmUnread" hidden></em></button>
  </header>
  <main class="rm-main">
    <section class="rm-stage" id="stage">
      <div class="rm-videos" id="videos"></div>
      <div class="rm-circle" id="circle"></div>
    </section>
    <aside class="rm-chat" id="chat">
      <div class="rm-chattools"><input id="chatQ" placeholder="Sohbette ara" autocomplete="off"></div>
      <div class="rm-pins" id="pins" hidden></div>
      <div class="rm-msgs" id="msgs"></div>
      <div class="rm-reply" id="replyBar" hidden><span id="replyTxt"></span><button id="replyX" type="button" aria-label="Vazgeç">✕</button></div>
      <form class="rm-send" id="send"><label class="att" title="Dosya / görsel gönder (yapıştırmak da olur)"><input type="file" id="fileIn" multiple hidden><svg viewBox="0 0 24 24"><path d="M20 11l-8 8a5 5 0 0 1-7-7l9-9a3.5 3.5 0 0 1 5 5l-9 9a2 2 0 0 1-3-3l8-8"/></svg></label><input id="msg" placeholder="Mesaj yaz…" maxlength="800" autocomplete="off"><button aria-label="Gönder"><svg viewBox="0 0 24 24"><path d="M3 20l18-8L3 4v6l12 2-12 2z"/></svg></button></form>
    </aside>
  </main>
  <nav class="rm-dock">
    <button id="bMic" title="Mikrofon (Ctrl+Shift+M)"><svg viewBox="0 0 24 24"><path class="on" d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM6 11a6 6 0 0 0 12 0M12 17v4M8 21h8"/><path class="off" d="M3 3l18 18"/></svg></button>
    <button id="bDeaf" title="Sağırlaştır (Ctrl+Shift+D)"><svg viewBox="0 0 24 24"><path class="on" d="M4 14v-2a8 8 0 0 1 16 0v2M4 14h3v6H4zM17 14h3v6h-3z"/><path class="off" d="M3 3l18 18"/></svg></button>
    <button id="bCam" title="Kamera"><svg viewBox="0 0 24 24"><path d="M3 7h12v10H3zM15 10l6-3v10l-6-3z"/></svg></button>
    <button id="bShare" title="Ekranı paylaş"><svg viewBox="0 0 24 24"><path d="M3 5h18v11H3zM8 20h8M12 16v4M12 13V8M9 10l3-3 3 3"/></svg></button>
    <button id="bPip" title="Küçük pencere / arka planda dinle"><svg viewBox="0 0 24 24"><path d="M3 5h18v14H3zM12 12h7v5h-7z"/></svg></button>
    <button id="bSb" title="Ses panosu"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg></button>
    <button id="bSet" title="Ayarlar"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    <button id="bLeave" class="bad" title="Ayrıl"><svg viewBox="0 0 24 24"><path d="M3 15c5-5 13-5 18 0l-3 3-3-2v-2a10 10 0 0 0-6 0v2l-3 2z"/></svg></button>
  </nav>
  <div class="rm-set" id="set" hidden>
    <h3>Ses</h3>
    <label>Mikrofon <select id="sMic"></select></label>
    <label>Gürültü engelleme
      <select id="sNs"><option value="rnnoise">Güçlü (RNNoise, yerel)</option><option value="browser">Tarayıcınınki</option><option value="off">Kapalı</option></select></label>
    <label>Konuşma <select id="sMode"><option value="vad">Ses algılama</option><option value="ptt">Bas-konuş</option></select></label>
    <label id="sPttRow">Bas-konuş tuşu <button id="sPtt" type="button">Bir tuşa bas…</button></label>
    <label>Mikrofon seviyesi <span class="meter"><i id="sMeter"></i></span></label>
    <label>Ses testi <button id="sTest" type="button">3 sn kaydet ve dinle</button></label>
    <label>Ses panosu sesi <input id="sSbVol" type="range" min="0" max="1" step="0.05"></label>
    <h3>Yayınlar</h3>
    <label>İzlediğim kalite <select id="sQ"><option value="auto">Otomatik</option><option value="src">Kaynak</option><option value="1080">1080p 60</option><option value="1080_30">1080p 30</option><option value="720">720p 30</option><option value="480">480p 30</option></select></label>
    <label>Paylaşım kalitesi <select id="sShareQ"><option value="">Otomatik</option><option value="smooth">Akıcı (oyun, video: 60 fps)</option><option value="sharp">Net (yazı, kod, slayt)</option></select></label>
    <p class="hint" id="sTurn"></p>
  </div>
</section>
<div class="sb-panel" id="sbPanel" hidden><div class="sb-head"><b>Ses panosu</b><input id="sbFind" placeholder="Ara…"><label class="sb-off"><input type="checkbox" id="sbOff"> Gelenleri sustur</label></div><div class="sb-list" id="sbList"></div></div>
<div class="pip-box" id="pipBox" hidden><video id="pipV" playsinline autoplay autopictureinpicture></video>
  <button id="pipGo" title="Küçük pencereye al">⧉</button><button id="pipX" title="Kapat">✕</button></div>
<div class="rm-toast" id="toast" hidden></div>
<script src="s/kami-embed.js"></script>
<script src="s/kami-guard.js"></script>
  <script src="s/room-core.js"></script>
<script src="s/room.js"></script>
</body>
</html>
