<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light dark; --accent: #1286A0; --muted: #646B80; --bg: #FFFFFF; --text: #1C2030; --line: #DDE1E8; }
    @media (prefers-color-scheme: dark) { :root { --accent: #4CC3D9; --muted: #8C92A6; --bg: #20232D; --text: #E6E8EF; --line: #313544; } }
    body { margin: 0; width: 280px; background: var(--bg); color: var(--text);
           font: 13px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
    .wrap { padding: 14px 16px 16px; display: grid; gap: 12px; }
    .head { display: flex; align-items: center; gap: 8px; font: 600 15px "Segoe UI Variable Display", "Segoe UI", sans-serif; }
    .head img { width: 20px; height: 20px; }
    .status { display: flex; gap: 8px; align-items: flex-start; color: var(--muted); }
    .status i { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex: none; background: var(--muted); }
    .status.on i { background: #2E9A5A; }
    .status.off i { background: #C93C45; }
    .status.on { color: var(--text); }
    label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
    label input { width: 16px; height: 16px; accent-color: var(--accent); }
    button { height: 32px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    @media (prefers-color-scheme: dark) { button { color: #0E2A31; } }
    button:disabled { opacity: .45; cursor: default; }
    .hint { margin: 0; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head"><img src="icons/32.png" alt="">Kami</div>
    <div class="status" id="status"><i></i><span id="statusText">…</span></div>
    <label><input type="checkbox" id="capture" disabled><span id="captureLabel"></span></label>
    <button id="open" disabled></button>
    <p class="hint" id="hint"></p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
