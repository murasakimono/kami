<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light dark; --accent: #6B3FE0; --btn: #6B3FE0; --muted: #675F78; --bg: #FFFFFF; --text: #1D1726; --line: #DED8EA; }
    @media (prefers-color-scheme: dark) { :root { --accent: #9D6BFF; --btn: #7C4DFF; --muted: #9A91AB; --bg: #15111C; --text: #E7E2EF; --line: #2A2236; } }
    body { margin: 0; width: 280px; background: var(--bg); color: var(--text);
           font: 13px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
    .wrap { padding: 14px 16px 16px; display: grid; gap: 12px; }
    .head { display: flex; align-items: center; gap: 8px; font: 600 15px "Segoe UI Variable Display", "Segoe UI", sans-serif; }
    .head img { width: 20px; height: 20px; }
    .status { display: flex; gap: 8px; align-items: flex-start; color: var(--muted); }
    .status i { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex: none; background: var(--muted); }
    .status.on i { background: #5FD3A0; }
    .status.off i { background: #F0626F; }
    .status.on { color: var(--text); }
    label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
    label input { width: 16px; height: 16px; accent-color: var(--accent); }
    button { height: 32px; border: 0; border-radius: 6px; background: var(--btn); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .45; cursor: default; }
    .media { display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; }
    .media h3 { margin: 0; font-size: 12px; color: var(--accent); }
    .media ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; max-height: 240px; overflow: auto; }
    .media li { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; }
    .media .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
    .media .kd { color: var(--muted); font-size: 11px; }
    .media .acts { display: flex; gap: 4px; grid-row: span 2; }
    .media .acts button { height: 26px; padding: 0 8px; font-size: 12px; }
    .media .empty { color: var(--muted); font-size: 12px; margin: 0; }
    .hint { margin: 0; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head"><img src="icons/32.png" alt="">Kami</div>
    <div class="status" id="status"><i></i><span id="statusText">…</span></div>
    <label><input type="checkbox" id="capture" disabled><span id="captureLabel"></span></label>
    <button id="open" disabled></button>
    <div class="media" id="media" hidden>
      <h3 id="mediaTitle"></h3>
      <ul id="mediaList"></ul>
      <p class="empty" id="mediaEmpty" hidden></p>
    </div>
    <p class="hint" id="hint"></p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
