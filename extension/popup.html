<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @font-face { font-family: "Chakra Petch"; font-weight: 600; src: url(fonts/ChakraPetch-SemiBold.ttf) format("truetype"); }
    @font-face { font-family: "Damnation"; src: url(fonts/Damnation.ttf) format("truetype"); }
    :root { color-scheme: dark; --accent: #A78BFA; --btn: #3B1580; --green: #2EE6A6; --muted: #8E86A3; --bg: #0B0910; --card: #16101F; --text: #EDE9F6; --line: #2B2238; }
    [hidden] { display: none !important; }
    .note { margin: 0; padding: 8px 10px; border-radius: 6px; background: var(--card); color: var(--text); font-size: 12px; box-shadow: inset 3px 0 0 var(--accent); }
    body { margin: 0; width: 290px; color: var(--text); font: 13px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
           background: radial-gradient(ellipse 120% 60% at 50% 0%, rgba(124, 58, 237, .28), transparent 70%), var(--bg); }
    .wrap { padding: 14px 16px 16px; display: grid; gap: 12px; }
    .head { display: flex; align-items: center; gap: 10px; font: 600 17px "Chakra Petch", "Segoe UI", sans-serif; letter-spacing: .5px; }
    .head img { width: 28px; height: 28px; border-radius: 8px; box-shadow: 0 0 14px rgba(46, 230, 166, .35); }
    .status { display: flex; gap: 8px; align-items: flex-start; color: var(--muted); padding: 8px 10px; border-radius: 6px; background: var(--card); }
    .status i { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex: none; background: var(--muted); }
    .status.on i { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .status.off i { background: #FF4D6A; box-shadow: 0 0 8px #FF4D6A; }
    .status.on { color: var(--text); }
    label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
    label input { width: 16px; height: 16px; accent-color: var(--green); }
    button { min-height: 34px; padding: 6px 10px; line-height: 1.25; overflow-wrap: anywhere; border: 0; background: var(--btn); color: #fff; font: 600 13px "Chakra Petch", "Segoe UI", sans-serif; cursor: pointer;
             clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px); box-shadow: inset 0 -2px 0 var(--green); transition: background .15s; }
    button:hover:not(:disabled) { background: #5B21B6; }
    #page { display: grid; justify-items: center; gap: 1px; }
    #page small { font-weight: 400; font-size: 11px; opacity: .85; }
    button.sec { background: var(--card); color: #C4B5FD; box-shadow: none; }
    button.sec:hover:not(:disabled) { background: #221932; }
    button.ok { background: #14765A; } button.err { background: #A3263B; }
    button:disabled { opacity: .45; cursor: default; }
    .media { display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; }
    .media h3 { margin: 0; font: 600 12px "Chakra Petch", sans-serif; color: var(--accent); letter-spacing: .6px; text-transform: uppercase; }
    .media ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; max-height: 240px; overflow: auto; }
    .media li { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; padding: 6px 8px; background: var(--card); border-radius: 6px; }
    .media .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
    .media .kd { color: var(--muted); font-size: 11px; }
    .media .acts { display: flex; gap: 4px; grid-row: span 2; }
    .media .acts button { height: 26px; min-height: 0; padding: 0 8px; font-size: 12px; }
    .media .acts button.bad { background: #A3263B; }
    .media .res { grid-column: 1 / -1; font-size: 11px; line-height: 1.35; overflow-wrap: anywhere; }
    .media .res.ok { color: var(--green); } .media .res.err { color: #FF4D6A; }
    .media .empty { color: var(--muted); font-size: 12px; margin: 0; }
    .hint { margin: 0; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
      body { width: 300px; border-top: 2px solid; border-image: linear-gradient(90deg, #7C3AED, #2EE6A6) 1; }
    .head { gap: 12px; }
    .head img { width: 54px; height: 54px; border-radius: 12px; border: 1.5px solid #7C3AED; box-shadow: 0 0 18px rgba(124,58,237,.45); }
    .head span { font: 400 26px "Damnation", "Chakra Petch", sans-serif; letter-spacing: 1px; background: linear-gradient(180deg, #fff, #A78BFA); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .status { background: none; padding: 0 2px; }
    .status.on { color: var(--green); }
    .media li { padding: 10px 10px 10px 12px; border: 1px solid var(--line); border-radius: 10px; }
    .media .nm { font-weight: 600; font-size: 13px; }
    .media .acts button { height: 34px; min-width: 34px; padding: 0 10px; border-radius: 8px; clip-path: none; box-shadow: none; background: #7C3AED; }
    .media .acts button:hover:not(:disabled) { background: #8B5CF6; }
    #open, #retry { border-radius: 8px; clip-path: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head"><img src="icons/128.png" alt=""><span>KAMI</span></div>
    <div class="status" id="status"><i></i><span id="statusText">…</span></div>
    <p class="note" id="detail" hidden></p>
    <button id="retry" class="sec" hidden></button>
    <label><input type="checkbox" id="capture" disabled><span id="captureLabel"></span></label>
    <p class="note" id="restricted" hidden></p>
    <button id="page" disabled hidden></button>
    <button id="open" class="sec" disabled></button>
    <div class="media" id="media" hidden>
      <h3 id="mediaTitle"></h3>
      <ul id="mediaList"></ul>
      <p class="empty" id="mediaEmpty" hidden></p>
    </div>
    <div class="media" id="torrents" hidden>
      <h3 id="torrentsTitle"></h3>
      <ul id="torrentList"></ul>
      <button id="rdAll"></button>
    </div>
    <p class="hint" id="hint"></p>
  </div>
  <script src="cloud_sites.js"></script>
  <script src="popup.js"></script>
</body>
</html>
