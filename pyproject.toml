[project]
name = "kami"
version = "0.8.0"
description = "Kami Download Manager (KDM) - kisisel, eklentilerle buyuyen indirme yoneticisi"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pillow>=13.0.0",
    "pyaudiowpatch>=0.2.12 ; sys_platform == 'win32'",
    "pypdf>=7.0.1",
    "pypdfium2>=5.15.2",
    "pystray>=0.19.5",
    "pywebview>=5.3",
    "vtracer>=0.6.15",
    "rlottie-python>=1.3",
    "yt-dlp[curl-cffi,default]>=2026.10.26",
    "rawpy>=0.28.0",
    "nvidia-ml-py>=13.615.71",
    "psutil>=7.2.2",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/e2e"]   # e2e betikleri elle calistirilir (tarayici/pencere acar)
